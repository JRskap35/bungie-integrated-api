/* ---------- progress that follows the Bungie sign in (cloud/worker.js, a Cloudflare Worker) ----------
   What a player enters by hand (armor pieces and stats, Looking for, marks, the armor class) is saved online under their
   Bungie.net account, so it shows up on any device they sign in from. The worker checks every call's Bungie token with
   Bungie itself. This browser remembers which saved version it last matched (BCLOUD) so that changes made while signed
   out, or after the hour long sign in ran out, go up the next time instead of being overwritten. If both sides changed,
   the two are combined, with this browser's entries winning where they overlap. */
const VAULT_API = BUNGIE && BUNGIE.vaultApi ? String(BUNGIE.vaultApi).replace(/\/+$/, "") : "";
const progSig = () => JSON.stringify([marks, armor, armorLook]);
const hasProgress = () => Object.keys(marks).length + Object.keys(armor).length + Object.keys(armorLook).length > 0;
const lCloud = () => "bia.cloud.v1." + ((BT && BT.mid) || "");
async function cloudCall(method, body){
  if(!bTokenOk()){ const e = new Error("signed out"); e.code = "auth"; throw e; }
  const r = await fetch(VAULT_API + "/v1/progress", {method, cache: "no-store",
    headers: Object.assign({"Authorization": "Bearer " + BT.access}, body ? {"Content-Type": "application/json"} : {}),
    body: body ? JSON.stringify(body) : undefined});
  if(r.status === 401){ const e = new Error("signed out"); e.code = "auth"; throw e; }
  if(!r.ok){ const e = new Error("HTTP " + r.status); e.code = "http"; throw e; }
  return r.json();
}
const cloudRef = {async set(body){
  const sig = JSON.stringify([body.marks, body.armor, body.armorLook]);
  const r = await cloudCall("PUT", {marks: body.marks, armor: body.armor, armorLook: body.armorLook, cls: body.cls});
  local.set(lCloud(), {base: r.savedAt || 0, sig});
}};
async function attachBungieCloud(){
  if(!VAULT_API){ setSync("local"); return; }
  setSync("loading");
  try{
    const remote = await cloudCall("GET");
    docRef = cloudRef;
    const seen = local.get(lCloud(), {base: 0, sig: null}) || {base: 0, sig: null};
    const mine = hasProgress() && progSig() !== seen.sig;               // changed here since the last sync
    if(!remote){ if(mine) await persist(); else setSync("saved"); return; }
    const theirs = (remote.savedAt || 0) !== seen.base;                  // changed somewhere else since then
    const R = {marks: remote.marks || {}, armor: remote.armor || {}, armorLook: remote.armorLook || {}};
    if(mine && theirs){
      marks = Object.assign({}, R.marks, marks); armor = Object.assign({}, R.armor, armor); armorLook = Object.assign({}, R.armorLook, armorLook);
      await persist(); render(); return;
    }
    if(mine){ await persist(); return; }
    marks = JSON.parse(JSON.stringify(R.marks)); armor = JSON.parse(JSON.stringify(R.armor)); armorLook = JSON.parse(JSON.stringify(R.armorLook));
    if(CLASSES.some(c => c[0] === remote.cls)) armorCls = remote.cls;
    local.set(LKEY, {marks, armor, armorLook, cls: armorCls, mode: MODE});
    local.set(lCloud(), {base: remote.savedAt || 0, sig: progSig()});
    setSync("saved");
    if(overlay.hidden && menu.hidden) render();
  }catch(e){ docRef = null; setSync(e && e.code === "auth" ? "error" : "offline"); }
}

/* ---------- website mode: Google sign in + Firestore (Firebase) ---------- */
const FB_CONFIG = (() => { try{ return JSON.parse(document.getElementById("vault-firebase").textContent); }catch(e){ return null; } })();
let fbAuth = null, fbUser = null, fbDb = null;
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
async function initFirebase(cfg){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  try{
    await loadScript(base + "firebase-app-compat.js");
    await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
  }catch(e){ setSync("offline"); return; }
  firebase.initializeApp(cfg);
  fbAuth = firebase.auth(); fbDb = firebase.firestore();
  document.getElementById("acct").hidden = false;
  fbAuth.getRedirectResult().catch(()=>{});
  fbAuth.onAuthStateChanged(user => {
    if(unsubVault){ unsubVault(); unsubVault = null; }
    fbUser = user; docRef = null; soundRef = null;
    paintAcct();
    if(!user){ setSync("signedout"); return; }
    setSync("loading");
    attachStore(fbDb.doc("users/" + user.uid + "/data/vault"), fbDb.doc("users/" + user.uid + "/data/sound"));
  });
}
function paintAcct(){
  const b = document.getElementById("acct"); if(!b) return;
  const name = fbUser ? (fbUser.displayName || fbUser.email || "Account") : "";
  b.classList.toggle("in", !!fbUser);

function perkNamed(w, arr, rows){

function render(){
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false"));
  const ms = document.getElementById("modeSeg");
  if(ms){ ms.hidden = !PVPD; ms.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === MODE)); }
  const got = WEAPONS.filter(w => ownedCount(w) > 0).length;
  $("#navCount").textContent = got ? got : "";
  let html = "";
  if(S.view === "drops")   html = dropsView();
  if(S.view === "weapons") html = weaponBrowser("all");
  if(S.view === "armor")   html = armorBlock("all");
  if(S.view === "vault")   html = vaultView();
  closeDD();
  $("#main").innerHTML = html;
  // keep the active ammo tab, and the weapon type picked under it, in view when the tab strip scrolls (phones)
  const strip = document.querySelector(".ammo-tabs"), slot = strip && [...strip.querySelectorAll(".ammo-slot")].find(x => x.querySelector('[aria-pressed="true"]'));
  if(slot && strip.scrollWidth > strip.clientWidth){
    const sr = strip.getBoundingClientRect(), r = slot.getBoundingClientRect();
    if(r.width > sr.width - 12 || r.left < sr.left) strip.scrollLeft += r.left - sr.left - 4;   // too wide to fit: start at the tab
    else if(r.right > sr.right) strip.scrollLeft += r.right - sr.right + 12;
  }
  hideTip();
}

/* ---------- weapons ---------- */
function baseWeapons(mode){ return mode === "vault" ? WEAPONS.filter(inVault) : WEAPONS; }
function scope(mode){ return baseWeapons(mode).filter(w => (S.ammo === "all" || w.a === S.ammo) && (S.arch === "all" || w.arch === S.arch)); }
function weaponBrowser(mode){

  const inAmmo = S.ammo === "all" ? base : base.filter(w => w.a === S.ammo);

  // All Weapons and Other have none. The chosen type shows on the active tab with a clear button.

    <div id="list">${weaponList(mode)}</div>`;
}
function filterValues(sc, f){
  let vals = [...new Set(sc.flatMap(w => fieldVals(w, f)).concat(S.filters[f] || []))].filter(v => v !== "");
  vals.sort((a,b) => f === "tier" ? TIER_ORDER[a]-TIER_ORDER[b] : f === "season" ? (+b)-(+a) : String(a).localeCompare(String(b)));
  return vals;
}
function weaponControls(mode){
  const st = mode === "vault" ? S.vStat : S.wStat;
  const opts = [["all","All"],["god","God Roll","var(--god)"],["semi","Semi-God","var(--semi)"],["looking","Looking for","var(--look)"]];
  if(mode !== "vault") opts.push(["none","Unmarked"]);
  opts.push(["trash","Safe to dismantle"]);
  const seg = opts.map(([k,l,c]) => `<button type="button" data-act="stat" data-mode="${mode}" data-k="${k}" aria-pressed="${st===k}">${k==="trash"?`<span class="seg-trash" aria-hidden="true">${I.trash}</span>`:c?`<span class="dot" style="--c:${c}"></span>`:""}${l}</button>`).join("");
  const sorts = SORT_FIELDS.map(([k,l]) => {
    const i = S.sorts.findIndex(s => s.key === k);
    if(i < 0) return `<span class="sort-pill"><button type="button" data-act="sort" data-k="${k}">${l}</button></span>`;
    const s = S.sorts[i];
    const dir = k === "tier" ? (s.dir > 0 ? "S→F" : "F→S") : (s.dir > 0 ? "A→Z" : "Z→A");
    return `<span class="sort-pill on"><button type="button" data-act="sort" data-k="${k}" aria-label="${l}, priority ${i+1}, ${dir}. Click to flip"><span class="sort-n">${i+1}</span>${l}<span class="sort-dir">${dir}</span></button><button type="button" class="x" data-act="sort-x" data-k="${k}" aria-label="Remove ${l} sort">×</button></span>`;
  }).join("");
  const sc = scope(mode);
  let nActive = 0;
  const fv = (f, v, label) => `<button type="button" class="fv" data-act="filt" data-f="${f}" data-v="${esc(v)}" aria-pressed="${(S.filters[f]||[]).includes(v)}">${label}</button>`;
  const groups = FILTER_FIELDS.map(([f,l]) => {
    if(f === "a" && S.ammo !== "all") return "";
    const vals = filterValues(sc, f);
    if(vals.length < 2 && !(S.filters[f]||[]).length) return "";
    const sel = S.filters[f] || [];
    nActive += sel.length;
    if(f === "act"){
      return `<div class="fgroup wide"><h3>${l}</h3>${groupActs(vals).map(([g, xs]) => `<div class="sub">${esc(g)}</div><div class="fvals">${xs.map(v => fv(f, v, esc(v))).join("")}</div>`).join("")}</div>`;
    }
    const label = v => f === "element" ? `<img src="${iconURL("e", String(v).toLowerCase())}" alt="">${esc(v)}` : f === "stun" ? `<img src="${STUN[v]||""}" alt="">${esc(v)}` : f === "tier" ? `<span class="dot" style="--c:${tierVar(v)};border-radius:2px"></span>${esc(v)}` : f === "season" ? `S${esc(v)}` : f === "a" ? `<span class="dot" style="--c:var(--ammo-${v});border-radius:1px"></span>${esc(AMMO_LABEL[v])}` : esc(v);
    if(f === "a") vals.sort((x,y) => AMMO.findIndex(a=>a.key===x) - AMMO.findIndex(a=>a.key===y));
    return `<div class="fgroup ${f==="frame"||f==="season"?"wide":""}"><h3>${l}</h3><div class="fvals">${vals.map(v => fv(f, v, label(v))).join("")}</div></div>`;
  }).join("");
  return `<div class="controls first">
      <label class="search">${I.search}<input id="wq" type="search" placeholder="Search names, perks, origin traits" value="${esc(S.q)}" autocomplete="off" aria-label="Search weapons"></label>
      <div class="seg" role="group" aria-label="Status">${seg}</div>
    </div>
    <div class="controls sort-row"><span class="ctl-label">Sort</span>${sorts}${S.sorts.length?`<button type="button" class="text-btn" data-act="sort-clear">Back to sheet order</button>`:""}</div>
    <details class="filters" ${S.fOpen?"open":""}><summary>${I.chev}Filters ${nActive?`<span class="badge-n">${nActive}</span><button type="button" class="text-btn clear" data-act="filt-clear">Clear filters</button>`:""}</summary><div class="fgroups">${groups}</div></details>`;
}
function matchStatus(w, st){
  const m = marks[w.id];
  if(st === "all") return true;
  if(st === "looking") return m === "looking";
  const c = reportCard(w).cards;
  if(st === "trash") return c.trash.list.length > 0;
  if(st === "god" || st === "semi") return (c[MODE] || {}).state === st;
  if(st === "none") return m !== "looking" && !c.pve.list.length && !c.pvp.list.length && !c.trash.list.length;
  return false;
}
// a weapon is in the Vault when you own a keeper of it in this mode, or flagged it as Looking for
const inVault = w => marks[w.id] === "looking" || isObtained(marks[w.id]) || ((reportCard(w).cards[MODE] || {}).list || []).length > 0;
const flat = a => a.map(x => Array.isArray(x) ? x[0] : x).join(" ");
function matchesQuery(w, q){
  return (w.name + " " + w.var + " " + w.arch + " " + archName(w.arch) + " " + flat(w.p1) + " " + flat(w.p2) + " " + w.origin + " " + flat(w.barrel) + " " + flat(w.mag)).toLowerCase().includes(q);
}
/* Change 3 (Joe, 2026-11-03): PvP All Weapons, with no sort picked, runs by time to kill instead of by weapon type.
   Weapons with a TTK (autos, hand cannons, pulses, scouts, sidearms, SMGs, from Hugo's chart, best with their perks)
   come first, fastest at the top; ties go to the faster base TTK, then the better tier. Everything without a TTK
   follows in Pride's tier order, S first, then his rank. */
const TTK_BEST = w => w.ttk && typeof w.ttk.best === "number" ? w.ttk.best : null;
function pvpAllOrder(a, b){
  const ta = TTK_BEST(a), tb = TTK_BEST(b);
  if((ta === null) !== (tb === null)) return ta === null ? 1 : -1;
  const tier = (TIER_ORDER[a.tier] ?? 9) - (TIER_ORDER[b.tier] ?? 9);
  if(ta !== null) return (ta - tb) || (a.ttk.base - b.ttk.base) || tier || a.rank - b.rank || (ARCH_ORDER[a.arch] - ARCH_ORDER[b.arch]);
  return tier || a.rank - b.rank || (ARCH_ORDER[a.arch] - ARCH_ORDER[b.arch]);
}
function sortList(list){
  const pvpAll = isPvp() && S.ammo === "all";
  return list.slice().sort((a,b) => {
    for(const s of S.sorts){
      let c;
      if(s.key === "tier") c = (TIER_ORDER[a.tier] ?? 9) - (TIER_ORDER[b.tier] ?? 9) || a.rank - b.rank;
      else if(s.key === "ammo") c = b.ammo - a.ammo;
      else if(s.key === "season") c = (+b.season) - (+a.season);
      else if(s.key === "p1" || s.key === "p2") c = flat(a[s.key]).localeCompare(flat(b[s.key]));
      else c = String(a[s.key]).localeCompare(String(b[s.key]));
      if(c) return c * s.dir;
    }
    if(pvpAll) return pvpAllOrder(a, b);
    return ((a.a === "exotic") - (b.a === "exotic")) || (ARCH_ORDER[a.arch] - ARCH_ORDER[b.arch]) || a.rank - b.rank;
  });
}
function weaponList(mode){
  if(mode === "vault" && !WEAPONS.some(inVault)){
    return `<div class="empty-state"><strong>Your vault is empty</strong><span>Weapons you own a keeper of, and weapons on your Looking for list, show up here.</span><button class="btn" data-act="nav" data-view="weapons">Browse weapons</button></div>`;
  }
  let items = scope(mode);
  const total = items.length;
  for(const [f, vals] of Object.entries(S.filters)) if(vals.length && (f !== "a" || S.ammo === "all")) items = items.filter(w => fieldVals(w, f).some(v => vals.includes(v)));
  const st = mode === "vault" ? S.vStat : S.wStat;
  items = items.filter(w => matchStatus(w, st));
  const q = S.q.trim().toLowerCase();
  if(q) items = items.filter(w => matchesQuery(w, q));
  items = sortList(items);
  const all = scope("all");
  const obtained = all.filter(w => ownedCount(w) > 0).length;
  const head = `<div class="result"><span>Showing ${items.length} of ${total}</span><span class="rc-prev" ${BUNGIE_LINKED ? "hidden" : ""}><span>Sample rolls</span><button type="button" class="rc-switch" data-act="rc-preview" aria-pressed="${PREVIEW}" title="Made up example copies that show how the report cards look until Bungie account sync is connected">${PREVIEW ? "On" : "Off"}</button></span><span>${obtained} / ${all.length} obtained here</span></div>`;
  if(!items.length) return head + `<div class="empty-state"><strong>No matches</strong><span>Nothing here fits the current search, status and filters.</span></div>`;
  const th = (k, l) => {
    const i = S.sorts.findIndex(s => s.key === k);
    const arrow = i < 0 ? "" : (S.sorts[i].dir > 0 ? "↓" : "↑") + (S.sorts.length > 1 ? (i+1) : "");
    return `<th><button type="button" class="hs ${i<0?"":"on"}" data-act="sort" data-k="${k}">${l}${arrow?` <span>${arrow}</span>`:""}</button></th>`;
  };
  const showArch = S.arch === "all";
  const rows = items.map(w => {
    const m = marks[w.id], open = !!S.open[w.id];
    const rowsN = Math.max(w.p1.length, w.p2.length, 1);
    const nameBlock = `<div class="nm"><div class="nm-txt"><div class="nm-line"><button type="button" class="name-btn" data-act="open" data-id="${w.id}" aria-expanded="${open}"><span class="wname">${esc(w.name)}</span></button>${ownBox(w)}<button type="button" class="expand" data-act="open" data-id="${w.id}" aria-label="${open?"Hide":"Show"} details for ${esc(w.name)}">${I.chev}</button></div>${w.var?`<div class="variant">${esc(w.var)}</div>`:""}<div class="nm-rc">${rcIcons(w)}</div><div class="wsub">${[showArch?esc(archName(w.arch)):"", w.season?`S${esc(w.season)}`:"", w.shop?`<span class="shoptag" title="Shopping List pick: ${esc(w.shop.role)}${w.shop.priority?` (${esc(w.shop.priority)} priority)`:""}">Shopping List</span>`:"", m?`<span class="mtag mt-${m}">${MLABEL[m]}</span>`:""].filter(Boolean).join(" · ")}</div></div></div>`;
    const notes = open ? [w.frameNote, ...w.stats.map(s => s[3])].filter(Boolean) : [];
    const detailGrid = open ? detailPanel(w) : "";
    if(PHONE.matches){
      return `<article class="wcard ${open?"open":""}">
        <div class="wc-top">${thumb(w)}<div class="wc-name">${nameBlock}</div>${tierCell(w.tier, w.rank)}</div>
        <div class="wc-info">${elemCell(w.element)}${frameCell(w)}${isPvp() ? "" : stunImg(w.stun)}${originCell(w)}<span class="wc-src">${w.srcX?`<s>${esc(w.source)}</s>`:esc(w.source)}</span></div>
        ${rcPanel(w)}
        <div class="wc-perks"><div class="wc-h">Perk 1</div><div class="wc-h">Perk 2</div>${perkNamed(w, w.p1, rowsN)}${perkNamed(w, w.p2, rowsN)}</div>
        ${detailGrid}</article>`;
    }
    const row = `<tr class="row ${open?"open":""}">
      <td class="c-thumb">${thumb(w)}</td>
      <td class="c-name">${nameBlock}</td>
      <td class="c-ico">${elemCell(w.element)}</td>
      <td class="c-ico">${frameCell(w)}</td>
      <td class="c-src">${w.srcX?`<s title="Struck on the sheet">${esc(w.source)}</s>`:esc(w.source)}</td>
      ${isPvp() ? "" : `<td class="c-ico">${stunImg(w.stun)}</td>`}
      <td class="c-perk">${perkCol(w, w.p1, rowsN)}</td>
      <td class="c-perk">${perkCol(w, w.p2, rowsN)}</td>
      <td class="c-ico">${originCell(w)}</td>
      <td class="c-tier">${tierCell(w.tier, w.rank)}</td>
    </tr>`;
    const rcp = rcPanel(w), span = isPvp() ? 9 : 10;
    const rcRow = rcp ? `<tr class="detail rcrow"><td colspan="${span}">${rcp}</td></tr>` : "";
    if(!open) return row + rcRow;
    return row + rcRow + `<tr class="detail"><td colspan="${span}">${detailGrid}</td></tr>`;
  }).join("");
  if(PHONE.matches) return head + `<div class="cards">${rows}</div>`;
  const pvp = isPvp();
  const cols = (pvp ? [7,26,7,7,17,8.5,8.5,9.5,9.5] : [7,25,6.5,6.5,15,6.5,8,8,9,8.5]).map(w => `<col style="width:${w}%">`).join("");
  return head + `<div class="table-wrap"><table class="wtable"><colgroup>${cols}</colgroup><thead>
    <tr class="bands"><th colspan="2" class="b-weapon">WEAPON</th><th colspan="${pvp ? 3 : 4}" class="b-info">INFO</th><th colspan="3" class="b-perks">PERKS</th><th class="b-analysis">GRADE</th></tr>
    <tr><th><span class="sr">Icon</span></th>${th("name","Name")}${th("element","Energy")}${th("frame","Frame")}${th("source","Source")}${pvp ? "" : th("stun","Stun")}${th("p1","Perk 1")}${th("p2","Perk 2")}${th("origin","Origin Trait")}${th("tier","Tier")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

      <div class="seg cls-seg" role="group" aria-label="Armor class">${CLASSES.map(([k,l]) => { const u = iconURL("n", k); return `<button type="button" data-act="acls" data-k="${k}" aria-pressed="${armorCls===k}">${u?`<span class="cls-ico" style="--src:url('${u}')" aria-hidden="true"></span>`:""}${l}</button>`; }).join("")}</div>

    <div class="controls"><span class="ctl-label">Tags</span><div class="fvals">${tags}</div>${S.aTags.length?`<button type="button" class="text-btn" data-act="atag-clear">Clear tags</button>`:""}</div>
    <div id="alist" data-mode="${mode}">${armorList(mode)}</div>`;
}
const bestTier = (s, pcs) => Math.min(...s.bonuses.filter(b => !pcs || b.pcs === pcs).map(b => TIER_ORDER[b.tier] * 1000 + b.rank));
function armorList(mode){
  let sets = mode === "vault" ? SETS.filter(s => piecesHave(s) > 0 || lookHave(s) > 0) : SETS.slice();
  if(mode === "vault" && !sets.length){
    return `<div class="empty-state"><strong>No armor logged yet</strong><span>Open Armor and tap a piece to log what you have or what you're looking for.</span><button class="btn" data-act="nav" data-view="armor">Browse armor</button></div>`;
  }
  const total = sets.length, st = S.aStat;
  sets = sets.filter(s => { const n = piecesHave(s);
    return st === "all" || (st === "none" && n === 0) || (st === "progress" && n > 0 && n < 5) || (st === "complete" && n === 5) || (st === "looking" && lookHave(s) > 0); });
  if(S.aTags.length) sets = sets.filter(s => S.aTags.every(t => s.bonuses.some(b => b.tags.includes(t))));
  const q = (mode === "vault" ? S.vaq : S.aq).trim().toLowerCase();
  if(q) sets = sets.filter(s => (s.name + " " + s.source + " " + s.bonuses.map(b => b.name + " " + b.effect + " " + b.trigger).join(" ")).toLowerCase().includes(q));
  const sorters = {sheet:(a,b)=>bestTier(a)-bestTier(b), tier4:(a,b)=>bestTier(a,4)-bestTier(b,4), tier2:(a,b)=>bestTier(a,2)-bestTier(b,2), name:(a,b)=>a.name.localeCompare(b.name), pieces:(a,b)=>piecesHave(b)-piecesHave(a)||bestTier(a)-bestTier(b)};
  sets.sort(sorters[S.aSort] || sorters.sheet);
  const logged = SETS.reduce((a,s)=>a+piecesHave(s),0);
  const lt = lookTotal();
  const head = `<div class="result"><span>Showing ${sets.length} of ${total} sets</span><span>${logged} / ${SETS.length*5} pieces logged${lt?` · ${lt} looking for`:""}</span></div>`;
  if(!sets.length) return head + `<div class="empty-state"><strong>No matches</strong><span>No sets fit the current search, status and tag filters.</span></div>`;
  const rows = sets.map(s => {
    const n = piecesHave(s), ps = piecesOf(s), open = !!S.open["set:"+s.id];
    const ls = lookOf(s);
    const badgeRow = (arr, cls) => { const shown = arr.slice(0,2), extra = arr.length - shown.length;
      return `<span class="badges ${cls}">${shown.map(k=>`<span class="sbadge ${cls}" style="--sc:var(--st-${statPrimary(k)})" title="${cls==="want"?"Looking for ":""}${STATNAME[k]}"><img src="${STAT_ICON[k]}" alt=""></span>`).join("")}${extra>0?`<span class="sbadge more">+${extra}</span>`:""}</span>`; };
    const btns = PIECES.map(([p,l]) => {
      const sel = validStats(ps[p]), want = validStats(ls[p]);
      const label = `${l} for ${esc(s.name)}` + (sel.length ? `, obtained: ${sel.map(k=>STATNAME[k]).join(", ")}` : ", not collected") + (want.length ? `, looking for: ${want.map(k=>STATNAME[k]).join(", ")}` : "");
      return `<button type="button" class="piece ${sel.length?"has":""} ${want.length?"want":""}" data-act="piece" data-set="${s.id}" data-piece="${p}" aria-haspopup="menu" aria-label="${label}">${pieceArt(s, p)}${want.length&&sel.length?`<span class="want-flag" title="Also looking for more">${I.looking}</span>`:""}${want.length?badgeRow(want,"want"):""}${sel.length?badgeRow(sel,""):""}</button>`;
    });
    const cells = btns.map(b => `<td class="c-piece">${b}</td>`).join("");
    const bonuses = s.bonuses.map(b => `<div class="bonus"><span class="pcs">${b.pcs}pc</span>${b.bi?(b.bd?`<span class="bi-tip" tabindex="0" role="img" aria-label="${b.pcs} piece bonus, ${esc(b.bn||b.name)}: ${esc(b.bd)}" data-tip="${esc(b.bd)}" data-tip-h="${b.pcs} piece · ${esc(b.bn||b.name)}"><img class="bi" src="${iconURL("t", b.bi)}" alt=""></span>`:`<img class="bi" src="${iconURL("t", b.bi)}" alt="">`):""}<span class="tier sm" style="--c:${tierVar(b.tier)}">${b.tier}</span><span>${esc(b.name)}</span></div>`).join("");
    const setCell = `<div class="set"><div class="set-icon"><img src="${iconURL("s", s.id)}" alt="" decoding="async"></div><div class="set-txt"><div class="nm"><button type="button" class="name-btn" data-act="open" data-id="set:${s.id}" aria-expanded="${open}"><span class="set-name wname">${esc(s.name)}</span></button><button type="button" class="expand" data-act="open" data-id="set:${s.id}" aria-label="${open?"Hide":"Show"} bonus details for ${esc(s.name)}">${I.chev}</button></div><div class="set-meta"><span>${esc(s.source)}</span><span class="mini-bar"><i style="width:${n*20}%"></i></span><span class="count">${n}/5</span></div></div></div>`;
    const detail = open ? `<div class="bonus-cards">${s.bonuses.map(b => `<div class="bcard">
      <div class="bcard-head"><span class="pcs">${b.pcs} piece</span>${b.bi?(b.bd?`<span class="bi-tip" tabindex="0" role="img" aria-label="${b.pcs} piece bonus, ${esc(b.bn||b.name)}: ${esc(b.bd)}" data-tip="${esc(b.bd)}" data-tip-h="${b.pcs} piece · ${esc(b.bn||b.name)}"><img class="bi lg" src="${iconURL("t", b.bi)}" alt=""></span>`:`<img class="bi lg" src="${iconURL("t", b.bi)}" alt="">`):""}<strong>${esc(b.name)}</strong>${tierCell(b.tier, b.rank)}${b.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <dl><dt>Trigger</dt><dd>${esc(b.trigger)}</dd><dt>Effect</dt><dd>${esc(b.effect)}</dd><dt>Analysis</dt><dd>${esc(b.desc)}</dd></dl></div>`).join("")}</div>` : "";
    if(PHONE.matches){
      return `<article class="acard ${open?"open":""}">${setCell}<div class="bonuses">${bonuses}</div>
        <div class="ac-pieces">${btns.map((b,i) => `<div class="ac-piece">${b}<span>${PIECES[i][0]==="class"?"Class":PIECES[i][1]}</span></div>`).join("")}</div>${detail}</article>`;
    }
    const row = `<tr class="row ${open?"open":""}"><td>${setCell}</td>
      <td><div class="bonuses">${bonuses}</div></td>${cells}</tr>`;
    if(!open) return row;
    return row + `<tr class="detail adetail"><td colspan="7">${detail}</td></tr>`;
  }).join("");
  if(PHONE.matches) return head + `<div class="cards">${rows}</div>`;
  const acols = [24,26,10,10,10,10,10].map(w => `<col style="width:${w}%">`).join("");
  return head + `<div class="table-wrap"><table class="atable"><colgroup>${acols}</colgroup><thead>
    <tr class="bands"><th class="b-weapon">SET</th><th class="b-bonus">BONUSES</th><th colspan="5" class="b-pieces">PIECES</th></tr>
    <tr><th>Set</th><th>Bonuses</th>${PIECES.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function vaultView(){
  const total = WEAPONS.length;
  // the weapon counters follow the copies on the account (or sample rolls, or your own marks when neither is on),
  // graded for the mode being viewed, the same way the God Roll and Semi-God filters do (Joe, 2026-11-03)
  const st = new Map(WEAPONS.map(w => [w, (reportCard(w).cards[MODE] || {}).state]));
  const owned = WEAPONS.filter(w => ownedCount(w) > 0).length;
  const god = WEAPONS.filter(w => st.get(w) === "god").length;
  const semi = WEAPONS.filter(w => st.get(w) === "semi").length;
  const look = WEAPONS.filter(w=>marks[w.id]==="looking").length;
  const pieces = SETS.reduce((a,s)=>a+piecesHave(s),0), piecesTotal = SETS.length*5;
  const full = SETS.filter(s=>piecesHave(s)===5).length;
  const pct = (a,b) => b ? Math.round(a/b*100) : 0;
  const summary = `<div class="summary">
    <div class="stat"><span class="k">Weapons obtained</span><span class="v">${owned}<small> / ${total}</small></span><span class="bar"><i style="width:${pct(owned,total)}%"></i></span></div>
    <div class="stat"><span class="k">God rolls</span><span class="v" style="color:var(--god)">${god}</span></div>
    <div class="stat"><span class="k">Semi-god rolls</span><span class="v" style="color:var(--semi)">${semi}</span></div>
    <div class="stat"><span class="k">Weapons looking for</span><span class="v" style="color:var(--look)">${look}</span></div>
    <div class="stat"><span class="k">Armor pieces</span><span class="v">${pieces}<small> / ${piecesTotal}</small></span><span class="bar"><i style="width:${pct(pieces,piecesTotal)}%"></i></span></div>
    <div class="stat"><span class="k">Full sets</span><span class="v">${full}<small> / ${SETS.length}</small></span></div>
    <div class="stat"><span class="k">Armor looking for</span><span class="v" style="color:var(--look)">${lookTotal()}<small> pieces</small></span></div>
  </div>`;
  const byAmmo = `<div class="ammo-progress">${AMMO.map(a => { const ws = WEAPONS.filter(w => w.a === a.key); const g = ws.filter(w => ownedCount(w) > 0).length;
    return `<div class="ap" style="--ammo:var(--ammo-${a.key})"><div class="ap-top"><span>${a.label}</span><span class="count">${g} / ${ws.length}</span></div><span class="bar"><i style="width:${pct(g,ws.length)}%"></i></span></div>`; }).join("")}</div>`;
  const sub = `<div class="subtabs" role="group" aria-label="Vault section">
    <button type="button" class="subtab" data-act="vsub" data-k="weapons" aria-pressed="${S.vaultSub==="weapons"}">Weapons</button>
    <button type="button" class="subtab" data-act="vsub" data-k="armor" aria-pressed="${S.vaultSub==="armor"}">Armor Sets</button></div>`;
  return `<div style="height:18px"></div>` + summary + byAmmo + sub +
    (S.vaultSub === "weapons" ? weaponBrowser("vault") : armorBlock("vault"));
}

/* full weapon image popup. Images are Bungie's weapon screenshots: the website loads them from bungie.net
   (trying older copies of a reissued weapon if the newest has no art yet); the Claude build can't reach
   bungie.net, so they ship as one file per weapon section (shots/<section>.json) loaded on first use. */
const SHOT_SHARDS = {};
const archSlug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function loadImg(urls){
  return urls.reduce((p, u) => p.catch(() => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(u); im.onerror = no; im.src = u; })), Promise.reject());
}
function shotSrc(w){
  const paths = Array.isArray(w.shot) ? w.shot : w.shot ? [w.shot] : [];
  if(!paths.length) return Promise.reject(new Error("no image"));
  if(FB_CONFIG) return loadImg(paths.map(p => "https://www.bungie.net" + p));
  const [k, sid] = w.sh || [archSlug(w.arch), w.id];
  if(!SHOT_SHARDS[k]) SHOT_SHARDS[k] = fetch(`shots/${k}.json`).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status))).catch(e => { delete SHOT_SHARDS[k]; throw e; });
  return SHOT_SHARDS[k].then(m => m[sid] ? loadImg([m[sid]]) : Promise.reject(new Error("no image")));
}
function shotModal(id){
  const w = BYID[id]; if(!w) return;
  const m = marks[id] || "";
  const status = {god:"God Roll", semi:"Semi-God Roll", looking:"Looking for"}[m];
  if(overlay.hidden) lastFocus = document.activeElement;
  overlay.classList.add("shotlay");
  overlay.innerHTML = `<div class="shotpop" role="dialog" aria-modal="true" aria-label="${esc(w.name)}" data-shot="${id}">
    <div class="shotframe ${m}" data-act="noop"><div class="ph loading"><img src="${iconURL("w", w.wi || id)}" alt=""><span>Loading image</span></div></div>
    <div class="shotcap" data-act="noop"><div><div class="nm2">${esc(w.name)}</div><div class="sub">${esc(archName(w.arch))} · ${esc(w.element)} · S${esc(w.season)} · Tier ${esc(w.tier)}${status?` · <b class="${m}">${status}</b>`:""}</div></div>
      <button type="button" class="close" data-act="modal-close" aria-label="Close" data-autofocus>${I.clear}</button></div>
  </div>`;
  overlay.hidden = false;
  overlay.querySelector("[data-autofocus]").focus();
  shotSrc(w).then(src => {
    const f = overlay.querySelector(".shotframe"); if(!f || overlay.hidden || (overlay.querySelector(".shotpop") || {}).dataset?.shot !== id) return;
    f.innerHTML = `<img class="full" src="${src}" alt="${esc(w.name)}">`;
  }).catch(() => {
    const ph = overlay.querySelector(".shotframe .ph"); if(!ph) return;
    ph.classList.remove("loading"); ph.querySelector("span").textContent = "Full image not available right now";
  });
}

  b.setAttribute("aria-label", volState() === "off" ? "God roll sound muted. Change volume" : `God roll sound volume ${Math.round(VOL.v*100)} percent. Change volume`);
  const pct = document.getElementById("volPct"), mb = document.querySelector(".vol-mute"), r = document.getElementById("vol");
  if(pct) pct.textContent = volState() === "off" ? "Muted" : Math.round(VOL.v*100) + "%";
  if(mb){ mb.innerHTML = SPK[volState()]; mb.setAttribute("aria-pressed", String(VOL.m)); mb.setAttribute("aria-label", VOL.m ? "Unmute" : "Mute"); }
  if(r){ r.style.setProperty("--p", (VOL.m ? 0 : VOL.v*100) + "%"); }
}
function openVolume(btn){

    <div class="vol">

/* ================= FX ================= */
let actx = null;
function chime(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const s = t + i*0.075;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.16*VOL.v), s+0.015); g.gain.exponentialRampToValueAtTime(0.0001, s+0.7);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+0.75);
    });
  }catch(e){}
}
function playGodSound(){
  if(VOL.m || VOL.v === 0) return;
  if(SOUND_URL){ try{ const a = new Audio(SOUND_URL); a.volume = Math.min(1, VOL.v); a.play().catch(chime); return; }catch(e){} }
  chime();
}
const cv = $("#confetti"); let parts = [], raf = 0;
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, n, angle, spread, speed){
  const cols = ["#3fdc86","#a8f5c8","#f3c64a","#ffffff","#9cc6e4","#2bb86c"];
  for(let i=0;i<n;i++){
    const a = angle + (Math.random()-.5)*spread, sp = speed*(0.55+Math.random()*0.7);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*0.35,c:cols[i%cols.length],t:0,ttl:110+Math.random()*70});
  }
  if(!raf){ cv.hidden = false; raf = requestAnimationFrame(tick); }
}
function tick(){
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  parts = parts.filter(p => p.t < p.ttl && p.y < H + 30);
  for(const p of parts){
    p.t++; p.vx *= 0.986; p.vy = p.vy*0.986 + 0.28; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    const flip = Math.abs(Math.cos(p.r*1.7));
    ctx.globalAlpha = Math.max(0, 1 - p.t/p.ttl);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h*flip/2, p.w, p.h*flip + 0.6);
    ctx.restore();
  }
  if(parts.length){ raf = requestAnimationFrame(tick); } else { raf = 0; ctx.clearRect(0,0,W,H); cv.hidden = true; }
}
function celebrate(id){
  playGodSound();
  const el = document.querySelector(`[data-thumb="${id}"]`);
  if(el){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  if(reduceMotion()) return;
  let x = innerWidth/2, y = innerHeight/2;
  if(el){ const r = el.getBoundingClientRect(); if(r.bottom > 0 && r.top < innerHeight){ x = r.left + r.width/2; y = r.top + r.height/2; } }
  burst(x, y, 90, -Math.PI/2, Math.PI*1.3, 13);
  burst(0, innerHeight, 70, -Math.PI/3, 0.6, 22);
  burst(innerWidth, innerHeight, 70, -Math.PI*2/3, 0.6, 22);
}
let toastT = 0;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200);
}

/* ================= EVENTS ================= */
function refreshList(){
  if(document.getElementById("list")) document.getElementById("list").innerHTML = weaponList(S.view === "vault" ? "vault" : "all");
  if(document.getElementById("alist")) document.getElementById("alist").innerHTML = armorList(S.view === "vault" ? "vault" : "all");
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if(!t || !t.closest("#menu")){ if(!(t && (t.dataset.act === "status" || t.dataset.act === "loc" || t.dataset.act === "piece" || t.dataset.act === "acct" || t.dataset.act === "sound"))) closeMenu(); }
  if(!t) return;
  const a = t.dataset.act, k = t.dataset.k, id = t.dataset.id;
  switch(a){
    case "noop": return;
    case "overlay": case "modal-close": closeModal(); return;
    case "nav": {
      const from = S.view; S.view = t.dataset.view; S.aStat = "all";
      if(from === "drops" && S.view !== "drops") clearDrops();          // leaving New Drops resets it; the copies stay graded under Weapons
      if(S.view === "drops"){ markDropsSeen(); syncNow("open"); }       // opening it re-syncs and clears the red bubble
      if(location.hash !== "#"+S.view) location.hash = S.view; render(); scrollTo({top:0}); return; }
    case "bsync": closeMenu(); syncNow("manual"); return;
    case "bsignout": closeMenu(); bSignOut(); return;
    case "loc": { const cid = t.dataset.cid; if(S.menuFor === "loc:" + cid && !menu.hidden){ closeMenu(); return; } openLocMenu(t, cid); return; }
    case "loc-move": moveCopy(t.dataset.cid, k); return;
    case "look": if(marks[id] === "looking") delete marks[id]; else marks[id] = "looking"; persist(); render();
      toast(marks[id] === "looking" ? `${BYID[id].name} added to Looking for` : `${BYID[id].name} removed from Looking for`); return;
    case "ammo": {
      const st = stuck(), again = S.ammo === k && S.arch === "all";
      const touch = lastPointer !== "mouse" && t.dataset.dd;
      if(touch && again && ddFor === k){ closeDD(); return; }   // second tap on an open menu closes it
      S.ammo = k; S.arch = "all"; render(); if(st) toCatbar();
      if(touch){ const nt = document.querySelector(`.ammo-tab[data-dd="${k}"]`); if(nt) openDD(nt); }
      return; }
    case "pick": { const st = stuck(); S.ammo = t.dataset.ammo; S.arch = k; render(); if(st) toCatbar(); return; }
    case "arch": { const st = stuck(); S.arch = k; render(); if(st) toCatbar(); return; }
    case "sort": {
      const i = S.sorts.findIndex(s => s.key === k);
      if(i < 0) S.sorts.push({key:k, dir:1}); else S.sorts[i].dir *= -1;
      render(); return; }
    case "sort-x": S.sorts = S.sorts.filter(s => s.key !== k); render(); return;
    case "sort-clear": S.sorts = []; render(); return;
    case "filt": {
      const f = t.dataset.f, v = t.dataset.v, cur = S.filters[f] || [];
      S.filters[f] = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v);
      render(); return; }
    case "filt-clear": e.preventDefault(); S.filters = {}; render(); return;
    case "stat": if(t.dataset.mode === "vault") S.vStat = k; else S.wStat = k; render(); return;
    case "astat": S.aStat = k; render(); return;
    case "asort": S.aSort = k; render(); return;
    case "mode": if(k !== MODE){
      const was = Object.entries(S.rc).filter(([, v]) => v).map(([i, v]) => [BYID[i], v]).filter(([w]) => w);
      applyMode(k); fixScope(); S.open = {}; S.cm = {};
      S.rc = {};
      was.forEach(([w, v]) => { const t = TWIN[MODE][rkeyOf(w)]; if(!t) return;
        const has = m => ((reportCard(t).cards[m] || {}).list || []).length;
        S.rc[t.id] = v === "all" ? (has("all") ? "all" : null) : v === "trash" ? (has("trash") ? "trash" : has(MODE) ? MODE : null) : has(MODE) ? MODE : has(v) ? v : null; });
      persist(); render(); scrollTo({top:0}); } return;
    case "acls": if(armorCls !== k){ armorCls = k; persist(); render(); } return;
    case "atag": S.aTags = S.aTags.includes(k) ? S.aTags.filter(x => x !== k) : S.aTags.concat(k); render(); return;
    case "atag-clear": S.aTags = []; render(); return;
    case "vsub": S.vaultSub = k; S.aStat = "all"; render(); return;
    case "open": S.open[id] = !S.open[id]; refreshList(); return;
    case "rc": S.rc[id] = S.rc[id] === k ? null : k; if(S.view === "drops") render(); else refreshList(); return;
    case "cmode": { const cid = t.dataset.cid; if(!cid) return; S.cm[cid] = k; if(S.view === "drops") render(); else refreshList(); return; }
    case "rc-preview": PREVIEW = !PREVIEW; local.set(LPREV, PREVIEW); render(); return;
    case "shot": shotModal(id); return;
    case "status":
      if(S.menuFor === id && !menu.hidden){ closeMenu(); return; }
      openMenu(t, id); return;
    case "m-obtained": closeMenu(); weaponModal(id); return;
    case "m-looking": closeMenu(); marks[id] = "looking"; persist(); render(); toast(`${BYID[id].name} added to Looking for`); return;
    case "m-clear": closeMenu(); delete marks[id]; persist(); render(); toast(`Cleared ${BYID[id].name}`); return;
    case "roll":
      marks[id] = k; persist(); closeModal(); render();
      if(k === "god"){ requestAnimationFrame(() => celebrate(id)); toast(`${BYID[id].name} logged as a God Roll`); }
      else { requestAnimationFrame(() => { const el = document.querySelector(`[data-thumb="${id}"]`); if(el) el.classList.add("pop"); }); toast(`${BYID[id].name} logged as a Semi-God Roll`); }
      return;
    case "piece": {
      const key = "set:" + t.dataset.set + ":" + t.dataset.piece;
      if(S.menuFor === key && !menu.hidden){ closeMenu(); return; }
      openArmorMenu(t, t.dataset.set, t.dataset.piece); return; }
    case "am-have": closeMenu(); armorModal(t.dataset.set, t.dataset.piece, "have"); return;
    case "am-want": closeMenu(); armorModal(t.dataset.set, t.dataset.piece, "want"); return;
    case "am-clear": {
      closeMenu(); const sid = t.dataset.set, pc = t.dataset.piece;
      for(const store of [armor, armorLook]){ if(store[sid]){ delete store[sid][pc]; if(!Object.keys(store[sid]).length) delete store[sid]; } }
      persist(); render(); toast(`Cleared ${SETBY[sid].name} ${PIECES.find(p=>p[0]===pc)[1].toLowerCase()}`); return; }
    case "stat-t": { const sel = S.edit.sel; sel.has(k) ? sel.delete(k) : sel.add(k); t.setAttribute("aria-pressed", sel.has(k)); return; }
    case "armor-save": {
      const {setId, piece, sel, mode} = S.edit;
      const ordered = STATS.map(s => s[0]).filter(x => sel.has(x));
      const store = mode === "want" ? armorLook : armor;
      store[setId] = store[setId] || {};
      if(ordered.length) store[setId][piece] = ordered; else delete store[setId][piece];
      if(!Object.keys(store[setId]).length) delete store[setId];
      let found = 0;
      if(mode !== "want" && armorLook[setId] && armorLook[setId][piece]){
        const before = armorLook[setId][piece];
        const left = before.filter(k => !sel.has(k)); found = before.length - left.length;
        if(left.length) armorLook[setId][piece] = left; else delete armorLook[setId][piece];
        if(!Object.keys(armorLook[setId]).length) delete armorLook[setId];
      }
      persist(); closeModal(); render();
      if(found) toast(`Found ${found === 1 ? "a stat type" : found + " stat types"} you were looking for. Removed from Looking for.`);
      return; }
    case "armor-clear": {
      const {setId, piece, mode} = S.edit;
      const store = mode === "want" ? armorLook : armor;
      if(store[setId]){ delete store[setId][piece]; if(!Object.keys(store[setId]).length) delete store[setId]; }
      persist(); closeModal(); render(); return; }
    case "sound":
      if(S.menuFor === "sound" && !menu.hidden){ closeMenu(); return; }
      openVolume(t); return;
    case "mute": {
      VOL.m = !VOL.m; if(!VOL.m && VOL.v === 0) VOL.v = 0.5;
      const r0 = document.getElementById("vol"); if(r0) r0.value = Math.round(VOL.v*100);
      saveVol(); paintVol(); return; }
    case "acct":
      if(BUNGIE){
        if(!BUNGIE_LINKED){ bSignIn(); return; }
        if(S.menuFor === "acct" && !menu.hidden){ closeMenu(); return; }
        openBungieMenu(t); return;
      }
      if(!fbAuth) return;
      if(!fbUser){ signIn(); return; }
      if(S.menuFor === "acct" && !menu.hidden){ closeMenu(); return; }
      openAcctMenu(t); return;
    case "signout":
      closeMenu(); marks = {}; armor = {}; armorLook = {}; local.del(LKEY); render();
      fbAuth.signOut(); toast("Signed out"); return;
    case "export": closeMenu(); exportProgress(); return;
    case "import": closeMenu(); document.getElementById("importFile").click(); return;
    case "import-go": {
      const d = pendingImport; pendingImport = null; if(!d) return;
      marks = d.marks || {}; armor = d.armor || {}; armorLook = d.armorLook || {};
      closeModal(); persist(); render(); toast("Progress imported"); return; }
    case "info": hideTip(); infoModal(); return;
    case "sound-test": playGodSound(); return;
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "vol"){ VOL.v = (+e.target.value)/100; VOL.m = false; saveVol(); paintVol(); return; }

/* hover labels for icons */
const tip = document.getElementById("tip"); let tipFor = null;
function showTip(el){
  const text = el.getAttribute("data-tip"); if(!text) return;
  const head = el.getAttribute("data-tip-h");
  tipFor = el; tip.hidden = false; tip.classList.remove("below");
  if(head){   // a titled bubble, used for Bungie's set bonus descriptions
    tip.innerHTML = `<b class="tip-h">${esc(head)}</b>${esc(text).replace(/\n+/g, "<br>")}`; tip.classList.add("rich");
  } else { tip.textContent = text; tip.classList.remove("rich"); }
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width/2 - tw/2; left = Math.max(8, Math.min(left, innerWidth - tw - 8));
  let top = r.top - th - 8;
  if(top < 8){ top = r.bottom + 8; tip.classList.add("below"); }
  tip.style.left = left + "px"; tip.style.top = top + "px";
  tip.style.setProperty("--ax", (r.left + r.width/2 - left) + "px");
}
function hideTip(){ tip.hidden = true; tipFor = null; }
document.addEventListener("pointerover", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el && el !== tipFor) showTip(el); else if(!el && tipFor) hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el) showTip(el); });
document.addEventListener("focusout", e => { if(e.target === tipFor) hideTip(); });

/* weapon type dropdowns under Primary, Secondary and Heavy */
let ddFor = null, ddTimer = 0, lastPointer = "mouse";

function openDD(tab){
  const dd = document.getElementById("ammoDD"); if(!dd) return;
  clearTimeout(ddTimer);
  const key = tab.dataset.dd, a = AMMO.find(x => x.key === key); if(!a) return;
  const base = baseWeapons(dd.dataset.mode).filter(w => w.a === key);

    + a.archs.map(ar => item(ar, archName(ar), base.filter(w => w.arch === ar).length, `<span class="sil-m" style="--sil:url('${iconURL("a", ar)}')" aria-hidden="true"></span>`)).join("");

}
function closeDD(){
