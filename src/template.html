<title>Endgame API</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky command bar (Weapons / Armor / Vault) and, below it, a sticky category bar (ammo tabs + archetype strip)
   that stays pinned while the dense item table scrolls underneath. Translucent panels float over the gold linework
   background. Palette: charcoal + muted gold from the background art; data colors (tiers, ammo, elements, section bands)
   come straight from the Endgame Analysis sheet. Deliberately single-theme dark. */
:root{
  color-scheme: dark;
  --bg:#0c0e10; --panel:rgba(0,0,0,.15); --veil:rgba(0,0,0,.15); --panel-solid:#131518; --panel-2:rgba(30,32,36,.88);
  --line:rgba(201,178,119,.13); --line-2:rgba(201,178,119,.26);
  --fg:#ece8df; --muted:#a59f92; --faint:#706b61;
  --accent:#c9b277; --accent-dim:#655c39;
  --god:#3fdc86; --semi:#f3c64a; --look:#9cc6e4;
  --ammo-primary:#ece8df; --ammo-special:#5ec46a; --ammo-heavy:#a971e6; --ammo-other:#d8b04c; --ammo-all:#e0453a; --ammo-exotic:#e8c548;
  --pve:#4a90e2; --pvp:#d8432f; --mode:var(--pve);
  --el-kinetic:#e8e8e8; --el-solar:#ff7f14; --el-arc:#65f3f7; --el-void:#c089d5; --el-stasis:#4f9aff; --el-strand:#00ec6c;
  --t-s:#57bb8a; --t-a:#a7c779; --t-b:#ffd666; --t-c:#f5b06b; --t-d:#e67c73; --t-e:#c27ba0; --t-f:#8e7cc3;
  --sh-weapon:#660000; --sh-info:#783f04; --sh-perks:#274e13; --sh-analysis:#20124d;
  --st-weapons:#f0a35a; --st-health:#6fd38a; --st-class:#78bff0; --st-grenade:#b88cf0; --st-super:#f3d36a; --st-melee:#f07c7c;
  --ink:#0c0e10;
  --hdr:60px;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel-solid)}
#bgart{position:fixed;inset:0;z-index:-1;background:var(--bg) var(--bgimg) center/cover no-repeat}
#bgart::after{content:"";position:absolute;inset:0;background:var(--vignette)}
:root{--vignette:radial-gradient(ellipse at 50% 45%,rgba(12,14,16,.08),rgba(12,14,16,.5) 80%)}
/* sticky bars show the background art itself (85%), so rows scrolling underneath stay hidden */
.artfill{background:linear-gradient(var(--veil),var(--veil)) fixed,var(--vignette) fixed,var(--bg) var(--bgimg) center/cover no-repeat fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;border-bottom:1px solid var(--line-2)}
.topbar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:0 26px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;height:60px;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.brand img{width:42px;height:42px;display:block;filter:drop-shadow(0 0 6px rgba(236,232,223,.18))}
.nav{display:flex;align-self:stretch}
.nav button{appearance:none;background:none;border:0;cursor:pointer;position:relative;height:60px;padding:0 18px;
  font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.nav button:hover{color:var(--fg)}
.nav-ico{height:30px;width:auto;flex:none;margin-right:2px}
.nav-ico[data-n="vault"]{height:24px}
.ammo-ico{height:16px;width:auto;flex:none;display:block}
.cls-seg button{display:inline-flex;align-items:center;gap:7px}
.cls-ico{display:block;width:15px;height:15px;flex:none;background:currentColor;-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.ammo-ico.tint{width:16px;height:18px;background:var(--ammo);-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ammo) 45%,transparent))}
.ammo-slot[style*="ammo-all"] .ammo-ico{height:20px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent);box-shadow:0 0 10px rgba(201,178,119,.6)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.acct-av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--ink);font:700 12px var(--font-body)}
.acct-av:empty{display:none}
.acct.in .acct-l{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:440px){ .acct.in .acct-l{display:none} .acct{padding:0 9px} .icon-btn.acct:not(.in) .acct-l{display:inline} .icon-btn.acct .acct-av:not(:empty){display:grid} }
.snd-ic{display:grid;place-items:center}
#soundBtn .snd-ic{display:grid}
.snd-ic svg{width:16px;height:16px}
#soundBtn.muted{color:var(--faint)}
.vol{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:6px 10px 10px;min-width:250px}
.menu .vol-mute{appearance:none;background:none;border:1px solid var(--line-2);color:var(--fg);width:34px;height:34px;padding:0;border-radius:2px;display:grid;place-items:center;cursor:pointer}
.menu .vol-mute:hover,.menu .vol-mute:focus-visible{border-color:var(--accent);color:var(--accent);background:none}
.vol-mute svg{width:18px;height:18px}
.menu .vol-mute[aria-pressed="true"]{color:var(--faint);background:rgba(255,255,255,.04)}
.vol-pct{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
#vol{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,80%),var(--line-2) var(--p,80%));cursor:pointer;margin:0}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);border:2px solid var(--accent);cursor:pointer}
#vol::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:2px solid var(--accent);cursor:pointer}
#vol:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.info-btn{appearance:none;background:none;border:0;padding:0;margin-left:-2px;width:26px;height:26px;display:grid;place-items:center;color:var(--muted);cursor:pointer;border-radius:50%;flex:none}
.info-btn svg{width:20px;height:20px}
.info-btn:hover{color:var(--accent)}
.credit{border:1px solid var(--line-2);background:rgba(201,178,119,.06);padding:14px 16px;display:grid;gap:6px;border-radius:2px}
.credit .sheet{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.credit .by{color:var(--muted)}
.credit .by b{color:var(--accent);font-weight:600}
.credit ul{margin:4px 0 0;padding-left:18px;color:var(--fg);display:grid;gap:3px;font-size:14px}
.fine{font-size:12.5px;color:var(--faint)!important}
/* phone cards */
.cards{display:grid;gap:8px}
.wcard,.acard{border:1px solid color-mix(in srgb,var(--mode) 55%,var(--line-2));background:var(--veil);border-radius:3px;padding:10px;display:grid;gap:8px}
.wcard.open,.acard.open{background:rgba(201,178,119,.07)}
.wc-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.wc-top .thumb{width:44px;height:44px}
.wc-name .nm{display:flex;align-items:center;gap:2px}
.wc-name .nm-txt{min-width:0}
.wc-name .wname{font-size:15px}
.wc-top .tier-cell{flex-direction:column;gap:1px}
.wc-top .expand,.acard .expand{flex:none;width:26px;height:26px}
.wc-info{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.wc-info .ic{width:34px;height:34px}
.wc-info .ic img{width:28px;height:28px}
.wc-info .ic img.stun{width:24px;height:24px}
.wc-info .ic.frame img{width:26px;height:26px}
.wc-src{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;max-width:45%}
.wc-perks{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:6px}
.wc-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:0 4px 3px}
.pcol{display:grid;grid-auto-rows:minmax(30px,auto)}
.pn{display:flex;align-items:center;gap:7px;padding:2px 4px;font-size:13px;line-height:1.2;min-width:0}
.pn + .pn{border-top:1px solid rgba(201,178,119,.16)}
.pn img{width:24px;height:24px;flex:none}
.pn.x{opacity:.45}
.wcard .dpanel{padding-top:8px;border-top:1px solid var(--line)}
.wcard .dbuild{grid-template-columns:1fr 1fr}
.wcard .dmeta{grid-template-columns:repeat(3,1fr)}
.wcard .dnotes{grid-column:1/-1}
.wcard .dstat{min-width:0;padding:8px}
.acard .set{gap:10px}
.acard .set-txt{min-width:0;flex:1}
.acard .set-txt .nm{display:flex;align-items:center;gap:2px}
.acard .bonuses{display:grid;gap:4px;padding-top:6px;border-top:1px solid var(--line)}
.acard .bonus + .bonus{margin-top:0}
.ac-pieces{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.ac-piece{display:grid;justify-items:center;gap:4px}
.ac-piece span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.acard .bonus-cards{grid-template-columns:1fr}
.wcard .dup{display:none}
.maker{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.maker b{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px}
a.btn svg{width:14px;height:14px}
.icon-btn{appearance:none;background:none;border:1px solid var(--line-2);color:var(--muted);height:36px;padding:0 12px;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:2px;font:500 13px var(--font-body)}
.icon-btn:hover{color:var(--fg);border-color:var(--faint)}
.icon-btn svg{width:16px;height:16px}

/* page */
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.count{font-family:var(--font-mono);font-size:12px;color:var(--faint);letter-spacing:0;font-variant-numeric:tabular-nums}

.catbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:20;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line-2)}
.catbar.flat{margin-top:0}
.ammo-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ammo-tabs::-webkit-scrollbar{display:none}
.ammo-tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;color:var(--muted);
  font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:12px 14px 10px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.ammo-tab:hover{color:var(--fg)}
.ammo-tab[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--ammo)}
.ammo-swatch{width:8px;height:8px;background:var(--ammo);transform:rotate(45deg);box-shadow:0 0 6px color-mix(in srgb,var(--ammo) 60%,transparent)}
.ammo-tab .count{font-size:11px}
.ammo-slot{display:flex;align-items:center;flex:none}
.ammo-tab .dd-caret{width:14px;height:14px;margin-left:-3px;opacity:.55;transition:transform .15s ease,opacity .15s ease}
.ammo-tab[aria-expanded="true"] .dd-caret{transform:rotate(180deg);opacity:.95}
.ammo-pick{display:inline-flex;align-items:center;gap:7px;margin:0 10px 0 0;padding:3px 4px 3px 9px;border:1px solid color-mix(in srgb,var(--ammo,var(--line-2)) 55%,var(--line-2));border-radius:2px;
  font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);white-space:nowrap;background:rgba(255,255,255,.03)}
.sil-s{display:block;width:40px;height:16px;background:currentColor;-webkit-mask:var(--sil) center/contain no-repeat;mask:var(--sil) center/contain no-repeat;opacity:.9}
.pick-x{appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:2px}
.pick-x:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.pick-x svg{width:13px;height:13px}
.ammo-dd{position:absolute;z-index:30;min-width:320px;max-width:calc(100vw - 24px);max-height:min(70vh,560px);overflow:auto;padding:6px;
  background:var(--panel-solid);border:1px solid var(--line-2);border-top:2px solid var(--ammo);box-shadow:0 18px 50px rgba(0,0,0,.55);border-radius:0 0 3px 3px;animation:ddin .14s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-item{appearance:none;width:100%;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;padding:9px 12px;background:none;border:0;border-left:2px solid transparent;
  color:var(--muted);cursor:pointer;text-align:left;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px}
.dd-item:hover,.dd-item:focus-visible{background:rgba(255,255,255,.05);color:var(--fg);outline:none}
.dd-item[aria-checked="true"]{color:var(--fg);border-left-color:var(--ammo);background:color-mix(in srgb,var(--ammo) 12%,transparent)}
.dd-item.empty{opacity:.45}
.dd-item:first-child{border-bottom:1px solid var(--line);margin-bottom:4px;border-radius:2px 2px 0 0}
.dd-item .count{font-size:11px}
.sil-m{display:block;width:72px;height:28px;background:currentColor;-webkit-mask:var(--sil) center/contain no-repeat;mask:var(--sil) center/contain no-repeat}
.sil-m.all{-webkit-mask:none;mask:none;background:none;position:relative}
.sil-m.ammo{-webkit-mask:none;mask:none;background:none;display:grid;place-items:center}
.sil-m.ammo .ammo-ico{height:20px}
.sil-m.all::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ammo);box-shadow:0 0 6px color-mix(in srgb,var(--ammo) 60%,transparent)}
.chips{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-block:10px;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);padding-right:28px}
.chips:empty{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted);cursor:pointer;border-radius:2px;
  font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;display:inline-flex;gap:6px;align-items:baseline;line-height:1.4;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chip .count{font-size:10.5px}
.chip:has(.sil){align-items:center}
.chip .sil{flex:none;display:block;height:26px;width:65px;margin-block:-4px;background:currentColor;opacity:.9;
  -webkit-mask:var(--sil) center/contain no-repeat;mask:var(--sil) center/contain no-repeat}
.chip[aria-pressed="true"] .sil{opacity:1}
.chip[aria-pressed="true"] .count{color:var(--ink);opacity:.6}
.chip.empty{opacity:.4}
.chip-sep{flex:none;width:2px;height:18px;margin-inline:4px;background:var(--ammo);opacity:.8;border-radius:1px}
.fgroup .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:10px 0 6px;width:100%}
.fgroup .sub:first-of-type{margin-top:0}
.subtabs{padding-top:14px}

.controls{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding-block:6px}
.controls.first{padding-top:14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);padding:0 10px;height:36px;flex:1 1 220px;max-width:320px;min-width:0;border-radius:2px}
.search svg{width:15px;height:15px;color:var(--faint);flex:none}
.search input{background:none;border:0;color:var(--fg);font:inherit;outline:none;width:100%;min-width:0}
.search:focus-within{border-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{appearance:none;background:none;border:0;border-right:1px solid var(--line-2);color:var(--muted);font:500 13px var(--font-body);padding:8px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.ctl-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-right:2px}
@media (min-width:761px){.ctl-label{min-width:64px}}
.sort-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sort-pill{display:inline-flex;align-items:stretch;border:1px solid var(--line-2);border-radius:2px}
.sort-pill button{appearance:none;background:none;border:0;color:var(--muted);font:500 13px var(--font-body);padding:6px 10px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.sort-pill button:hover{color:var(--fg)}
.sort-pill.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.sort-pill.on button{color:var(--fg)}
.sort-pill .x{border-left:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:0 8px;color:var(--muted)}
.sort-n{font-family:var(--font-mono);font-size:10.5px;background:var(--accent);color:var(--ink);width:16px;height:16px;display:inline-grid;place-items:center;border-radius:50%}
.sort-dir{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.text-btn{appearance:none;background:none;border:0;color:var(--accent);font:500 13px var(--font-body);cursor:pointer;padding:6px 4px}
.text-btn:hover{text-decoration:underline}

.filters{border:1px solid var(--line);background:var(--panel);margin-block:10px 4px;border-radius:2px}
.filters summary{cursor:pointer;padding:10px 14px;font-family:var(--font-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.filters summary::-webkit-details-marker{display:none}
.filters summary .chev{width:14px;height:14px;color:var(--faint);transition:transform .15s}
.filters[open] summary .chev{transform:rotate(90deg)}
.filters .badge-n{font-family:var(--font-mono);font-size:11px;background:var(--accent);color:var(--ink);padding:1px 7px;border-radius:9px;letter-spacing:0}

/* Change 1 (Joe, 2026-11-03): the PvE, PvP and Safe to dismantle icons sit on their own line under every weapon's name,

#tip .tip-src{float:right;margin:-1px 0 4px 10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-2);padding:1px 5px;border-radius:2px}
.bi-tip{display:inline-flex;flex:none;cursor:help;border-radius:2px}

.nowrap{white-space:nowrap}
.c-piece{text-align:center;width:84px}

.wname{font-weight:600;font-size:15.5px;line-height:1.2}
.name-btn{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg)}

.variant{display:block;font-style:italic;font-size:12px;color:var(--accent);margin-top:1px}
.wsub{color:var(--muted);font-size:12.5px;margin-top:7px}
.mtag{font-weight:600}
.mt-god{color:var(--god)} .mt-semi{color:var(--semi)} .mt-looking{color:var(--look)}
.el{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.el .dot{width:9px;height:9px;transform:rotate(45deg);border-radius:1px}
.dim{color:var(--faint)}
s{color:var(--faint);text-decoration-thickness:1.5px}
.lines{display:grid;gap:1px;line-height:1.3}
.stun{width:20px;height:20px;display:block;opacity:.92}
.stats-cell{display:flex;gap:4px;flex-wrap:wrap}
.ammo{display:inline-flex;align-items:baseline;gap:4px;min-width:36px;justify-content:center;padding:3px 7px;border-radius:2px;font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--ink);background:var(--c,var(--panel-2));font-variant-numeric:tabular-nums}
.ammo.plain{color:var(--fg);border:1px solid var(--line-2)}

.ammo small{font-size:9.5px;opacity:.75;font-family:var(--font-body);text-transform:uppercase;letter-spacing:.06em}
sup.fn{font-family:var(--font-mono);font-size:9.5px;color:var(--accent);cursor:help;margin-left:1px}
.ammo sup.fn{color:var(--ink)}
.tier-cell{display:flex;align-items:center;gap:6px}
.tier{display:inline-grid;place-items:center;width:28px;height:28px;font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink);border-radius:2px;background:var(--c)}
.rank{font-family:var(--font-mono);font-size:11px;color:var(--faint);min-width:22px}
.expand{appearance:none;background:none;border:1px solid transparent;color:var(--faint);width:30px;height:30px;display:grid;place-items:center;cursor:pointer;border-radius:2px}

.expand svg{width:14px;height:14px;transition:transform .15s}
.open .expand svg{transform:rotate(90deg)}
tr.detail td{background:rgba(201,178,119,.07);padding:4px 14px 16px;text-align:left}
.dpanel{display:grid;gap:10px}
.dbuild{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dbox{border:1px solid var(--line-2);background:rgba(0,0,0,.28);border-radius:3px;min-width:0;overflow:hidden}
.dbox h4,.dstat h4,.dnotes h4{margin:0;font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.dbox ul{list-style:none;margin:0;padding:2px 0}
.dbox li{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13.5px;line-height:1.25;min-height:34px}

.dbox li.none{color:var(--faint)}
.dmeta{display:grid;grid-template-columns:auto auto auto 1fr;gap:8px;align-items:stretch}
.dstat,.dnotes{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:3px;padding:8px 12px;display:grid;gap:6px;align-content:start}
.dstat{min-width:96px}
.dstat b{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.04em;line-height:1}

.foot{color:var(--muted);font-size:13px}

/* status button + thumbs */
.status-btn{appearance:none;width:32px;height:32px;display:grid;place-items:center;border:1px dashed var(--line-2);background:transparent;color:var(--faint);cursor:pointer;border-radius:2px}
.status-btn:hover{color:var(--fg);border-color:var(--muted)}
.status-btn svg{width:17px;height:17px}
.status-btn.s-god{border:1px solid var(--god);color:var(--god);background:rgba(63,220,134,.1)}
.status-btn.s-semi{border:1px solid var(--semi);color:var(--semi);background:rgba(243,198,74,.1)}
.status-btn.s-looking{border:1px solid var(--look);color:var(--look);background:rgba(156,198,228,.08)}
.thumb{position:relative;width:46px;height:46px;overflow:hidden;border:2px solid var(--line-2);border-radius:2px;background:var(--panel-2)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.big{width:88px;height:88px}
.thumb.god{border-color:var(--god);box-shadow:0 0 0 1px rgba(63,220,134,.35),0 0 16px rgba(63,220,134,.55)}
.thumb.god::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(220,255,236,.6) 50%,transparent 58%);animation:sheen 2.8s ease-in-out infinite;pointer-events:none}
.thumb.semi{border-color:var(--semi);box-shadow:0 0 0 1px rgba(243,198,74,.3),0 0 12px rgba(243,198,74,.4)}
.thumb.looking{border-style:dashed;border-color:var(--look)}
.thumb.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
button.thumb{appearance:none;display:block;padding:0;font:inherit;color:inherit;cursor:zoom-in;transition:transform .15s ease,filter .15s ease}
button.thumb:hover{transform:scale(1.06);filter:brightness(1.12)}
button.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* full weapon image popup: same border language as the weapon's thumbnail */
.overlay.shotlay{background:rgba(4,7,11,.86)}
.shotpop{display:grid;gap:10px;justify-items:center;max-width:100%;animation:rise .2s ease-out}
.shotframe{position:relative;display:block;border:2px solid var(--line-2);border-radius:2px;background:var(--panel-2);overflow:hidden;line-height:0;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.shotframe img.full{display:block;width:auto;height:auto;max-width:min(1100px,calc(100vw - 48px));max-height:calc(100vh - 150px)}
.shotframe .ph{width:min(1100px,calc(100vw - 48px));aspect-ratio:16/9;max-height:calc(100vh - 150px);display:grid;place-items:center;align-content:center;gap:12px;line-height:1.3;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.shotframe .ph img{width:96px;height:96px;opacity:.85}
.shotframe .ph.loading img{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.shotframe.god{border-color:var(--god);box-shadow:0 0 0 1px rgba(63,220,134,.35),0 0 28px rgba(63,220,134,.5),0 24px 70px rgba(0,0,0,.6)}
.shotframe.god::after{content:"";position:absolute;inset:-2px;border:2px solid transparent;border-radius:2px;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(220,255,236,.95) 50%,transparent 58%) border-box;background-size:300% 100%;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);
  animation:edgesheen 2.8s ease-in-out infinite}
@keyframes edgesheen{0%{background-position:100% 0}55%,100%{background-position:0 0}}
.shotframe.semi{border-color:var(--semi);box-shadow:0 0 0 1px rgba(243,198,74,.3),0 0 22px rgba(243,198,74,.4),0 24px 70px rgba(0,0,0,.6)}
.shotframe.looking{border-style:dashed;border-color:var(--look)}
.shotcap{display:flex;align-items:center;gap:14px;max-width:min(1100px,calc(100vw - 48px));width:100%;justify-content:space-between}
.shotcap .nm2{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1.15}
.shotcap .sub{color:var(--muted);font-size:13px;margin-top:2px}
.shotcap .sub b{font-weight:600}
.shotcap .sub .god{color:var(--god)} .shotcap .sub .semi{color:var(--semi)} .shotcap .sub .looking{color:var(--look)}
.shotcap .close{appearance:none;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);cursor:pointer;width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:2px}
.shotcap .close:hover{color:var(--fg);border-color:var(--faint)}
.shotcap .close svg{width:18px;height:18px}
@media (prefers-reduced-motion: reduce){.shotframe.god::after{animation:none}button.thumb{transition:none}}
@keyframes sheen{0%{transform:translateX(-55%)}55%,100%{transform:translateX(55%)}}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}

/* armor */
.set{display:flex;align-items:center;gap:12px;min-width:0}
.set-icon{width:40px;height:40px;flex:none;border-radius:2px;background:#000;border:1px solid var(--line-2);overflow:hidden}
.set-icon img{width:100%;height:100%;display:block}
.set-name{font-weight:600;font-size:15.5px;line-height:1.2}
.set-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin-top:3px;flex-wrap:wrap}
.mini-bar{width:56px;height:4px;background:var(--line-2);border-radius:2px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--god)}
.bonus{display:flex;align-items:center;gap:8px;font-size:13.5px;line-height:1.25}
.bonus + .bonus{margin-top:6px}
.bonus img.bi{width:20px;height:20px;flex:none;opacity:.92}

.tier.sm{width:20px;height:20px;font-size:13px;flex:none}
.piece{appearance:none;position:relative;width:48px;height:48px;display:inline-grid;place-items:center;background:var(--panel-2);border:2px solid var(--line-2);color:var(--faint);cursor:pointer;border-radius:2px}

.piece.has .pimg{opacity:1}
.piece:hover .pimg{opacity:.8}
.piece.has:hover .pimg{opacity:1}
.piece.has{border-color:var(--god);color:var(--fg);box-shadow:0 0 12px rgba(63,220,134,.3);background:linear-gradient(160deg,rgba(63,220,134,.14),var(--panel-2) 70%)}
.badges{position:absolute;right:-6px;bottom:-6px;display:flex;gap:2px;z-index:1}
.badges.want{right:auto;left:-6px}
.sbadge.want{border-style:dashed;border-color:var(--look)}
.piece.want{border-style:dashed;border-color:var(--look);color:var(--muted);background:linear-gradient(160deg,rgba(156,198,228,.1),var(--panel-2) 70%)}
.piece.has.want{border-style:solid;border-color:var(--god)}
.piece .want-flag{z-index:1;position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--ink);border:1.5px solid var(--look);color:var(--look);display:grid;place-items:center}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--muted);font-size:12.5px}

.modal-head h2 .mode{font-size:14px;letter-spacing:.12em;margin-left:10px}

.sbadge{width:22px;height:22px;border-radius:3px;background:var(--ink);display:grid;place-items:center;border:1.5px solid var(--sc);box-shadow:0 0 0 1.5px var(--bg)}
.sbadge img{width:16px;height:16px;display:block}
.sbadge.more{background:var(--fg);color:var(--ink);font:600 9.5px var(--font-mono);width:auto;min-width:22px;padding:0 3px;border-color:var(--fg)}
tr.detail.adetail td{padding-left:72px}
.bonus-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bcard{border:1px solid var(--line-2);background:rgba(0,0,0,.3);padding:12px 14px;display:grid;gap:8px;border-radius:2px}
.bcard-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.bcard dd{margin:0;white-space:pre-line}

/* vault */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:transparent;border:1px solid var(--line);margin-block:4px 22px;border-radius:2px;overflow:hidden}
.stat{background:var(--veil);box-shadow:0 0 0 1px var(--line);padding:14px 16px 16px;display:grid;gap:6px;align-content:start}
.stat .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:18px;color:var(--faint);font-weight:600}
.bar{height:4px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--god)}
.ammo-progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 22px;margin:-8px 0 22px}
.ap{display:grid;gap:5px}
.ap-top{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px}

.subtabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:6px}
.subtab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;color:var(--muted);
  font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 18px 9px 0;margin-right:22px}
.subtab:hover{color:var(--fg)}
.subtab[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.empty-state{border:1px dashed var(--line-2);padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty-state strong{font-family:var(--font-display);font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}

/* buttons, modal, menu, toast */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font:600 14px var(--font-body);padding:9px 16px;cursor:pointer;border-radius:2px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--god);border-color:var(--god);color:#06200f}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,7,11,.76);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .15s ease-out}

.modal-body{padding:18px;display:grid;gap:16px}

.wm-hero{display:flex;gap:16px;align-items:center}

.target{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:1px solid var(--line);padding:10px 12px;background:var(--panel-2);border-radius:2px;font-size:13.5px}
.target .k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.rolls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roll{appearance:none;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);padding:14px;cursor:pointer;display:grid;gap:5px;border-radius:2px}
.roll .rt{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.roll .rd{color:var(--muted);font-size:13px}
.roll.god .rt{color:var(--god)} .roll.semi .rt{color:var(--semi)}
.roll.god:hover,.roll.god:focus-visible,.roll.god[aria-pressed="true"]{border-color:var(--god);box-shadow:0 0 0 1px var(--god),0 0 20px rgba(63,220,134,.22)}
.roll.semi:hover,.roll.semi:focus-visible,.roll.semi[aria-pressed="true"]{border-color:var(--semi);box-shadow:0 0 0 1px var(--semi),0 0 20px rgba(243,198,74,.2)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats .row-label{grid-column:1/-1;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:6px 0 -2px}

/* ================= Change 5 (Joe, 2026-11-03): the mode color leads the content =================
   Charcoal and muted gold stay the look of the app: the header, the brand, page titles, body text, the Vault's stats and
   progress bars, the ammo tabs and their colors, and the Obtained box all keep the gold. Everything that says what you
   are looking at, or what you picked, takes the mode color instead, blue in PvE and red in PvP: the selected page tab
   underline, sub tabs, the search box, status buttons, sort and filter picks, column sort arrows, table and card
   outlines, row lines, open details, the owned copies dropdown and the location tile. --mode comes from the PvE / PvP
   toggle (data-mode on the page). */
:root{
  --mline:color-mix(in srgb,var(--mode) 40%,var(--line-2));        /* resting outline */
  --mrow:color-mix(in srgb,var(--mode) 18%,var(--line));           /* row and divider lines */
  --mtint:color-mix(in srgb,var(--mode) 13%,transparent);          /* picked fill */
  --mtext:color-mix(in srgb,var(--mode) 58%,#ffffff);              /* mode color as readable text */
}
:focus-visible{outline-color:var(--mode)}
.nav button[aria-current="page"]::after{background:var(--mode);box-shadow:0 0 10px color-mix(in srgb,var(--mode) 65%,transparent)}
.subtabs{border-bottom-color:var(--mrow)}
.subtab[aria-pressed="true"]{border-bottom-color:var(--mode)}
.search{border-color:var(--mline)}
.search:focus-within{border-color:var(--mode);box-shadow:0 0 0 1px var(--mtint)}
.search svg{color:var(--mtext)}
.seg{border-color:var(--mline)}
.seg button{border-right-color:var(--mline)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--mode) 16%,var(--panel-2));box-shadow:inset 0 -2px 0 var(--mode)}
.sort-pill{border-color:var(--mline)}
.sort-pill.on{border-color:var(--mode);background:var(--mtint)}
.sort-pill .x{border-left-color:color-mix(in srgb,var(--mode) 45%,transparent)}
.sort-n{background:var(--mode);color:#fff}
.sort-dir{color:var(--mtext)}
.text-btn{color:var(--mtext)}
.filters{border-color:var(--mline)}
.filters .badge-n{background:var(--mode);color:#fff}
.fv:hover{border-color:var(--mline)}
.fv[aria-pressed="true"]{border-color:var(--mode);background:var(--mtint)}
th{border-bottom-color:var(--mline)}
th .hs.on{color:var(--mtext)}
td{border-bottom-color:var(--mrow)}
tr.detail td{background:color-mix(in srgb,var(--mode) 7%,transparent)}
.name-btn:hover .wname{color:var(--mtext)}
.rc-switch[aria-pressed="true"]{border-color:var(--mode);color:var(--mtext);background:var(--mtint)}
.rc-panel{border-top-color:var(--mline);border-right-color:var(--mline);border-bottom-color:var(--mline)}
.rc-copy + .rc-copy{border-top-color:var(--mrow)}
.rc-part{border-color:color-mix(in srgb,var(--mode) 22%,var(--line))}
.rkeys{border-left-color:var(--mline)}
.loc-tile{border-color:var(--mline)}
.loc-tile:hover,.loc-tile:focus-visible,.loc-tile[aria-expanded="true"]{border-color:var(--mode);background:color-mix(in srgb,var(--mode) 14%,rgba(0,0,0,.35))}
.piece:hover{border-color:var(--mode)}
.acard .bonuses{border-top-color:var(--mrow)}
.empty-state{border-color:var(--mline)}
</style>

<script>
(function(){
"use strict";

/* ================= DATA (from Destiny 2: Endgame Analysis) ================= */
const D = JSON.parse(document.getElementById("vault-data").textContent);
const ICON_SRC = JSON.parse(document.getElementById("vault-icons").textContent);
ICON_SRC.t = JSON.parse(document.getElementById("vault-trait-icons").textContent);
ICON_SRC.e = JSON.parse(document.getElementById("vault-elements").textContent);
document.documentElement.style.setProperty("--bgimg", 'url("__BG__")');
/* ---- two modes: PvE (TheAegisRelic's Endgame Analysis) and PvP (Pride Eternal / Finnald's PvP Spreadsheet).
   Same layout; applyMode() swaps the weapon list, sections and armor ratings. PvP weapon ids start with "pvp-",
   so both modes' marks live side by side in one saved progress; armor pieces are the same items in both modes. ---- */
const AMMO_BASE = [{key:"primary", label:"Primary"},{key:"special", label:"Secondary"},{key:"heavy", label:"Heavy"},{key:"other", label:"Other"}];
const PVED = {weapons:D.weapons, sets:D.sets, ammo:D.ammo};
const PVPD = D.pvp ? (() => { const by = Object.fromEntries(D.pvp.sets.map(s => [s.id, s]));
  return {weapons:D.pvp.weapons, ammo:D.pvp.ammo, sets:D.sets.map(s => ({...s, bonuses:(by[s.id] || {bonuses:[]}).bonuses}))}; })() : null;
let AMMO, AMMO_TABS, AMMO_OF_ARCH, WEAPONS, SETS, SETBY, AMMO_LABEL, SET_TAGS, ARCH_ORDER, SORT_FIELDS, FILTER_FIELDS, MODE = "pve";
const isPvp = () => MODE === "pvp";
// activities: split combined sources ("Xur, Dares") and tidy spelling variants from the sheet
const ACT_FIX = {"Cosmodrom e":"Cosmodrome","NODE. OVRD. AVALON":"NODE.OVRD. AVALON","Kell's Fall?":"Kell's Fall","?":"Unknown","":"Unknown"};
const ALL_WEAPONS = D.weapons.concat(PVPD ? PVPD.weapons : []);
// PvP rows use the same filter values as PvE. Pride's sheet words energy, frame, season and source its own way
// ("Rapid-Fire", "Trials of Osiris / Saint-14 Vendor"), so a filter picked in PvE found nothing after switching to PvP.
// Each PvP weapon takes those fields from the same weapon on the PvE sheet; weapons only Pride lists get the same wording.
(() => {
  if(!PVPD) return;
  const nm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const byKey = {}, byName = {};
  D.weapons.forEach(w => { byKey[w.arch + "|" + nm(w.name)] ??= w; byName[nm(w.name)] ??= w; });
  const FRAME = {"Rapid-Fire":"Rapid", "Rapid Fire Slug":"Rapid Slug", "Support Frame (Healing)":"Support", "Wave Sword":"Wave", "Disruption Weapon":"Disruption"};
  const tidyFrame = f => FRAME[f] || String(f || "").replace(/\s*\(.*\)\s*$/, "").replace(/ Heat$/, "");
  const VENDORS = ["Banshee", "Xur", "Zavala", "Shaxx"];
  const tidySrc = x => {
    x = x.trim().replace(/\s+(Raid|Dungeon|Destination|Loot Pool)$/i, "");
    const v = x.match(/^(.+?)\s+Vendor$/i); if(v) return VENDORS.includes(v[1]) ? v[1] : "";
    return {"Trials of Osiris":"Trials", "Dares of Eternity":"Dares", "Vanguard":"Zavala"}[x] ?? x;
  };
  PVPD.weapons.forEach(w => {
    const t = byKey[w.arch + "|" + nm(w.name)] || byName[nm(w.name)];
    if(t){
      w.source = t.source; w.srcX = t.srcX;
      if(t.element) w.element = t.element;
      if(t.season) w.season = t.season;
      w.frame = t.frame || tidyFrame(w.frame);
    } else {
      w.frame = tidyFrame(w.frame);
      w.source = [...new Set(String(w.source || "").split(/\s*[\/,]\s*/).map(tidySrc).filter(Boolean))].join(", ");
    }
  });
})();
ALL_WEAPONS.forEach(w => { w.acts = [...new Set(String(w.source || "").split(",").map(x => x.trim()).map(x => ACT_FIX[x] ?? x))]; });
const ACT_GROUPS = [
  ["Raids", ["Crota's End","Deep Stone Crypt","Desert Perpetual","Epic Desert Perpetual","Garden of Salvation","King's Fall","Last Wish","Root of Nightmares","Salvation's Edge","Vault of Glass","Vow of the Disciple"]],
  ["Dungeons", ["Duality","Ghosts of the Deep","Grasp of Avarice","Pit of Heresy","Prophecy","Shattered Throne","Spire of the Watcher","Sundered Doctrine","Vesper's Host","Warlord's Ruin"]],
  ["PvP", ["Crucible","Competitive","Trials","Iron Banner"]],
  ["Playlists & Ops", ["Arena Ops","Fireteam Ops","Solo Ops","Pinnacle Ops","Onslaught","Gambit","Dares"]],
  ["Vendors", ["Banshee","Xur","Zavala","Shaxx"]],
  ["Destinations", ["World","EDZ","Cosmodrome","Europa","Moon","Nessus","Neomuna","Throne World","Pale Heart","Dreaming City","Kepler"]]
];
const ACT_GROUP_OF = Object.fromEntries(ACT_GROUPS.flatMap(([g, xs]) => xs.map(x => [x, g])));
function groupActs(acts){
  const out = ACT_GROUPS.map(([g, xs]) => [g, xs.filter(x => acts.includes(x))]);
  out.push(["Seasonal & other", acts.filter(x => !ACT_GROUP_OF[x]).sort((a,b) => a === "Unknown" ? 1 : b === "Unknown" ? -1 : a.localeCompare(b))]);
  return out.filter(([, xs]) => xs.length);
}
const BYID = Object.fromEntries(ALL_WEAPONS.map(w => [w.id, w]));
const NOTES = D.notes;
const STUN = D.stun;
const PIECES = [["head","Head"],["arms","Arms"],["chest","Chest"],["legs","Legs"],["class","Class Item"]];
const STAT_ICON = JSON.parse(document.getElementById("vault-stat-icons").textContent);
const BASE_STATS = [["health","Health"],["melee","Melee"],["grenade","Grenade"],["super","Super"],["class","Class"],["weapons","Weapons"]];
const BASE_NAME = Object.fromEntries(BASE_STATS);
const PAIRS = {health:["grenade","class"],melee:["health","weapons"],grenade:["super","class"],super:["health","melee"],class:["melee","weapons"],weapons:["grenade","super"]};
// each row: one primary stat's two pairings (primary / secondary)
const STATS = BASE_STATS.flatMap(([k,l]) => PAIRS[k].map(t => [k+"-"+t, l+" / "+BASE_NAME[t]]));
const statPrimary = k => k.split("-")[0];
const STATNAME = Object.fromEntries(STATS);
const TIER_ORDER = {S:0,A:1,B:2,C:3,D:4,E:5,F:6};
const tierVar = t => `var(--t-${String(t).toLowerCase()})`;
const SORT_ALL = [["name","Name"],["element","Energy"],["frame","Frame"],["source","Source"],["stun","Stun"],["p1","Perk 1"],["p2","Perk 2"],["origin","Origin Trait"],["tier","Tier"]];
const FILTER_ALL = [["act","Activity"],["a","Ammo Type"],["element","Energy"],["stun","Stun Type"],["tier","Tier"],["frame","Frame"],["season","Season"]];
function applyMode(m){
  MODE = m === "pvp" && PVPD ? "pvp" : "pve";
  const src = MODE === "pvp" ? PVPD : PVED;
  AMMO = AMMO_BASE.concat(MODE === "pvp" ? [{key:"exotic", label:"Exotic"}] : []).map(a => ({...a, archs:src.ammo[a.key] || []})).filter(a => a.archs.length);
  AMMO_TABS = [{key:"all", label:"All Weapons", archs:[...new Set(AMMO.flatMap(a => a.archs))]}, ...AMMO];
  AMMO_OF_ARCH = Object.fromEntries(AMMO.filter(a => a.key !== "exotic").flatMap(a => a.archs.map(x => [x, a.key])));
  WEAPONS = src.weapons; SETS = src.sets; SETBY = Object.fromEntries(SETS.map(s => [s.id, s]));
  AMMO_LABEL = Object.fromEntries(AMMO.map(a => [a.key, a.label]));
  SET_TAGS = [...new Set(SETS.flatMap(s => s.bonuses.flatMap(b => b.tags)))].sort();
  ARCH_ORDER = Object.fromEntries(AMMO_BASE.flatMap(a => PVED.ammo[a.key] || []).map((x,i) => [x,i]));
  // stun types are a PvE (champion) mechanic, so PvP leaves them out
  SORT_FIELDS = SORT_ALL.filter(([k]) => MODE === "pve" || k !== "stun");
  FILTER_FIELDS = FILTER_ALL.filter(([k]) => MODE === "pve" || k !== "stun");
  document.documentElement.dataset.mode = MODE;
}
applyMode("pve");
// full weapon type names for the sheet's section shorthand (the shorthand stays the data key, so saved progress is untouched)
const ARCH_NAME = {Autos:"Auto Rifles", HCs:"Hand Cannons", Pulses:"Pulse Rifles", Scouts:"Scout Rifles", SMGs:"Submachine Guns",
  BGLs:"Breech Grenade Launchers", Fusions:"Fusion Rifles", Snipers:"Sniper Rifles", Traces:"Trace Rifles",
  HGLs:"Heavy Grenade Launchers", LFRs:"Linear Fusion Rifles", LMGs:"Machine Guns", Rockets:"Rocket Launchers"};
const archName = ar => ARCH_NAME[ar] || ar;
// Bungie's weapon type silhouette (from Banshee's Gunsmith Orders), drawn as a mask so it takes the text color
function sil(ar){ const u = iconURL("a", ar); return u ? `<span class="sil" style="--sil:url('${u}')" aria-hidden="true"></span>` : ""; }
const fieldVals = (w, f) => f === "act" ? w.acts : [w[f]];
const MLABEL = {god:"God Roll",semi:"Semi-God Roll",looking:"Looking for"};
const ammoNum = w => { const s = w.stats[0]; const n = s ? parseFloat(s[1]) : NaN; return isNaN(n) ? -1 : n; };
ALL_WEAPONS.forEach(w => { w.ammo = ammoNum(w); });

// decode icons into blob URLs once, on demand
const iconCache = {};
function iconURL(kind, id){
  const key = kind + id;
  if(iconCache[key]) return iconCache[key];
  const src = (ICON_SRC[kind] || {})[id];
  if(!src) return "";
  try{
    const [head, b64] = src.split(",");
    const mime = head.slice(5, head.indexOf(";"));
    const bin = atob(b64); const u8 = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    iconCache[key] = URL.createObjectURL(new Blob([u8], {type:mime}));
  }catch(e){ iconCache[key] = src; }
  return iconCache[key];
}

/* ================= REPORT CARDS (Bungie-Integrated-API) =================
   One weapon, two report cards. Every weapon shows three icons after its name: PvE (Bungie's Vanguard badge),
   PvP (Bungie's Crucible badge) and a trash can. Each owned copy of the weapon is graded against Aegis's PvE roll
   and the cross checked PvP roll: green = god roll, yellow = semi god roll, grey = none owned, faded dashed = that
   sheet does not rate the weapon. The trash can counts copies that miss in both modes. A circled number shows how
   many copies sit behind a lit icon; clicking it lists those copies with each part, matches highlighted.
   Owned copies will come from Bungie account sync (RC_SYNC, not built yet). Until then: your God Roll / Semi-God
   marks count as one copy each (roll unknown), or, with Sample rolls on, made up example copies show the look.
   Grading follows Joe's roll rules (see gradeIn). */
const rkeyOf = w => w.arch + "|" + String(w.name).toLowerCase().replace(/[^a-z0-9]/g, "");
const TWIN = {pve:{}, pvp:{}};
D.weapons.forEach(w => { const k = rkeyOf(w); if(!TWIN.pve[k]) TWIN.pve[k] = w; });
(PVPD ? PVPD.weapons : []).forEach(w => { const k = rkeyOf(w); if(!TWIN.pvp[k]) TWIN.pvp[k] = w; });
const PART_ICON = {}, MW_ICON = {};
ALL_WEAPONS.forEach(w => {
  Object.entries(w.pi || {}).forEach(([n, id]) => { if(!PART_ICON[n]) PART_ICON[n] = id; });
  Object.entries(w.mwi || {}).forEach(([n, id]) => { if(!MW_ICON[n]) MW_ICON[n] = id; });
});
const liveNames = arr => (arr || []).filter(x => !Array.isArray(x)).map(x => x);
const mwList = w => (w && w.mw || "").split("/").map(x => x.trim()).filter(Boolean);
// Bungie names a masterwork by its tier ("Tier 3: Reload Speed"); the sheets name the stat ("Reload"). mwClean keeps the
// stat as the game words it, mwKey lines both up ("Reload Speed" = "Reload") for highlights and icons (Joe, 2026-11-03)
const mwClean = n => String(n || "").replace(/^Masterworked:\s*/i, "").replace(/^Tier\s*\d+\s*:\s*/i, "").trim();
const mwKey = n => mwClean(n).toLowerCase().replace(/\s+speed$/, "");
const MW_ICON_K = {}, ORIGIN_ICON = {};
ALL_WEAPONS.forEach(w => {
  Object.entries(w.mwi || {}).forEach(([n, id]) => { if(!MW_ICON_K[mwKey(n)]) MW_ICON_K[mwKey(n)] = id; });
  if(w.origin && w.oi && !ORIGIN_ICON[w.origin]) ORIGIN_ICON[w.origin] = w.oi;
});
const RC_SYNC = {};                  // Bungie account sync will fill this: weapon key -> [{barrel, mag, p1, p2, mw}]
const LPREV = "bia.preview.v1";
let PREVIEW = local.get(LPREV, true) !== false;
function seeded(str){
  let h = 2166136261; for(const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const SECTION_POOL = {};
function sectionPool(arch, f){
  const k = arch + "|" + f;
  if(!SECTION_POOL[k]) SECTION_POOL[k] = [...new Set(ALL_WEAPONS.filter(w => w.arch === arch).flatMap(w => liveNames(w[f])))];
  return SECTION_POOL[k];
}
const SAMPLE_CACHE = {};
function sampleCopies(k, o){         // example copies for the preview only, the same every time for a given weapon
  if(!o && SAMPLE_CACHE[k]) return SAMPLE_CACHE[k];  // o = {seed, n}: a fresh made up drop for the sample sync
  const e = TWIN.pve[k], p = TWIN.pvp[k], any = e || p, r = seeded(o ? o.seed : k);
  const forced = !o && /\|lodbrokc$/.test(k);        // the example from the voice chat: one PvP god roll, one to dismantle
  const out = [];
  if(!o && /\|decatur02$/.test(k)){                         // voice chat example: a three perk drop, PvP semi god roll on Physic + Circle of Life
    out.push({barrel: "Hammer-Forged Rifling", mag: "Tactical Mag", p1: ["Physic", "Zen Moment", "Dynamic Sway Reduction"],
              p2: ["Circle of Life", "Kill Clip", "Kinetic Tremors"], mw: "Stability"});
    return (SAMPLE_CACHE[k] = out);
  }
  if(forced || o || r() < 0.3){
    const own = f => [...new Set([e, p].filter(Boolean).flatMap(w => liveNames(w[f])))];
    const junkOf = f => sectionPool(any.arch, f).filter(x => !own(f).includes(x));
    const from = a => a.length ? a[Math.floor(r() * a.length)] : "";
    const pick = (f, mode) => { const mine = own(f), junk = junkOf(f); return mode === "junk" ? from(junk.length ? junk : mine) : from(mine.length && (r() < 0.55 || !junk.length) ? mine : junk); };
    const mws = [...new Set([e, p].filter(Boolean).flatMap(mwList))];
    const n = o ? o.n : forced ? 2 : 1 + Math.floor(r() * 3);
    const lists = [e, p].filter(w => w && liveNames(w.p1).length && liveNames(w.p2).length);
    for(let i = 0; i < n; i++){
      if(forced && i === 0 && p){ out.push({barrel: liveNames(p.barrel)[0] || "", mag: liveNames(p.mag)[0] || "", p1: liveNames(p.p1)[0] || "", p2: liveNames(p.p2)[0] || "", mw: mwList(p)[0] || ""}); continue; }
      // aim each example at a kind (god, semi, or junk) in one of the weapon's sheets, so the preview shows every color
      const roll = forced || !lists.length ? 1 : r(), L = lists.length ? lists[Math.floor(r() * lists.length)] : null;
      let p1, p2;
      if(roll < 0.25){ p1 = liveNames(L.p1)[0]; p2 = liveNames(L.p2)[0]; }
      else if(roll < 0.6){
        const a1 = liveNames(L.p1), a2 = liveNames(L.p2);
        p1 = from(a1); p2 = from(a2);
        if(p1 === a1[0] && p2 === a2[0]) { if(a2.length > 1) p2 = a2[1 + Math.floor(r() * (a2.length - 1))]; else if(a1.length > 1) p1 = a1[1]; }
      } else { p1 = pick("p1", "junk"); p2 = pick("p2", "junk"); }
      const mode = roll >= 0.6 ? "junk" : "";
      // higher tier drops roll extra perks in each column: add 0 to 2 more, never repeating one
      const width = 1 + Math.floor(r() * 3);
      const widen = (f, first) => { const col = [first]; const pool = [...new Set(own(f).concat(junkOf(f)))].filter(x => x && x !== first);
        while(col.length < width && pool.length){ const j = Math.floor(r() * pool.length); const x = pool.splice(j, 1)[0];
          if(roll >= 0.6 && own(f).includes(x)) continue;  // a junk example stays junk
          col.push(x); }
        return col; };
      p1 = widen("p1", p1); p2 = widen("p2", p2);
      if(roll >= 0.25 && roll < 0.6){                    // a semi example must not pick up both top perks by chance
        const L1 = liveNames(L.p1)[0], L2 = liveNames(L.p2)[0];
        if(p1.includes(L1) && p2.includes(L2)) p2 = p2.filter(x => x !== L2).concat(p2.length > 1 ? [] : liveNames(L.p2).slice(1, 2));
      }
      // Bungie reports perks in the order the game shows them, so the ones that matter can sit anywhere in a column
      const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      p1 = shuffle(p1); p2 = shuffle(p2);
      // some drops roll two barrels or two magazines
      const parts = f => { const first = pick(f, mode), col = [first];
        if(r() < 0.45){ const pool = [...new Set(own(f).concat(junkOf(f)))].filter(x => x && x !== first && !(mode === "junk" && own(f).includes(x)));
          if(pool.length) col.push(pool[Math.floor(r() * pool.length)]); }
        return shuffle(col.filter(Boolean)); };
      out.push({barrel: parts("barrel"), mag: parts("mag"), p1, p2,
                mw: mws.length && roll < 0.6 && r() < 0.7 ? from(mws) : "Handling"});
    }
  }
  out.forEach((c, i) => locOf(c, k + "#" + i + (o ? o.seed : "")));
  return o ? out : (SAMPLE_CACHE[k] = out);
}
// Joe's roll rules (2026-11-01), per mode, against that mode's perk lists (struck perks don't count):
//   god roll       = the top listed perk in Perk 1 AND the top listed perk in Perk 2 (No Hesitation PvE: Physic + Chaos Reshaped)
//   semi-god roll  = a listed perk in BOTH columns, but not both top ones (Physic + Attrition Orbs, Burning Ambition + Attrition Orbs)
//   not a keeper   = a listed perk in only one column, or in neither. A copy that is not a keeper in PvE or PvP is safe to dismantle.
// A copy can roll several perks in a column (higher tier drops roll two or three); you can pick any of them in game,
// so a copy is graded on the best perk it has in each column.
const opts = v => Array.isArray(v) ? v.filter(Boolean) : v ? [v] : [];
function gradeIn(c, L){
  if(!L) return "na";
  const l1 = liveNames(L.p1), l2 = liveNames(L.p2), c1 = opts(c.p1), c2 = opts(c.p2);
  if(!l1.length || !l2.length || !c1.some(x => l1.includes(x)) || !c2.some(x => l2.includes(x))) return "none";
  return c1.includes(l1[0]) && c2.includes(l2[0]) ? "god" : "semi";
}
// how a part of a copy lights up in a mode's panel: the top listed pick is green, any other listed pick is yellow
function partHit(f, v, L){
  if(!L || !v) return "";
  const list = f === "mw" ? mwList(L).map(mwKey) : liveNames(L[f]);
  const i = list.indexOf(f === "mw" ? mwKey(v) : v);
  return i < 0 ? "" : i === 0 ? "god" : "semi";
}
function reportCard(w){
  const k = rkeyOf(w), L = {pve: TWIN.pve[k], pvp: TWIN.pvp[k]};
  const copies = BUNGIE_LINKED ? (RC_SYNC[k] || []) : (PREVIEW ? sampleCopies(k).concat(DROPS.copies[k] || []) : []);
  const cards = {pve:{list:[]}, pvp:{list:[]}, trash:{list:[]}, all:{list:[]}};
  const keep = g => g === "god" || g === "semi";
  copies.forEach(c => {
    const g = {pve: gradeIn(c, L.pve), pvp: gradeIn(c, L.pvp)};
    ["pve","pvp"].forEach(m => { if(keep(g[m])) cards[m].list.push({c, g: g[m]}); });
    if(!keep(g.pve) && !keep(g.pvp)) cards.trash.list.push({c, g: "none"});
    cards.all.list.push({c, g: keep(g[MODE]) ? g[MODE] : keep(g.pve) ? g.pve : keep(g.pvp) ? g.pvp : "none"});
  });
  if(!BUNGIE_LINKED && !PREVIEW) ["pve","pvp"].forEach(m => { const mk = L[m] && marks[L[m].id]; if(keep(mk)) cards[m].list.push({c: null, g: mk}); });
  if(!BUNGIE_LINKED && !PREVIEW){ const mk = L[MODE] && marks[L[MODE].id]; if(keep(mk)) cards.all.list.push({c: null, g: mk}); }
  ["pve","pvp"].forEach(m => {
    const ls = cards[m].list.sort((a, b) => (a.g === "god" ? 0 : 1) - (b.g === "god" ? 0 : 1));
    cards[m].state = !L[m] ? "na" : ls.some(x => x.g === "god") ? "god" : ls.length ? "semi" : "none";
  });
  cards.trash.state = cards.trash.list.length ? "trash" : "none";
  return {k, L, cards};
}

/* ================= NEW DROPS + SYNC =================
   Sync works like DIM: automatically every minute while the page is open and visible, plus the Sync button in the
   top bar, with the last sync time beside it. Each sync compares the account's weapons with the last one and lists
   anything new under New Drops (duplicates included), graded PvE / PvP / safe to dismantle. A red bubble on the
   Postmaster icon counts drops you haven't looked at; opening New Drops re-syncs and clears the bubble; leaving it
   clears the list (the copies stay graded under Weapons).
   Bungie account sync is not built yet (BUNGIE_LINKED stays false). With Sample rolls on, the Sync button
   simulates finishing an activity: one to three made up drops, sometimes two of the same weapon. */
let BUNGIE_LINKED = false;             // true once a Bungie account is signed in and loaded (see BUNGIE ACCOUNT below)
const LDROPS = "bia.drops.v1";
const DROPS = Object.assign({list: [], copies: {}, last: 0}, local.get(LDROPS, {}));
const saveDrops = () => local.set(LDROPS, DROPS);
const unseenDrops = () => DROPS.list.filter(d => !d.seen).length;
function paintSync(){
  const b = document.getElementById("dropBadge"), n = unseenDrops();
  if(b){ b.hidden = !n; b.textContent = !n ? "" : n > 99 ? "99+" : n; }
  const l = document.getElementById("bsyncL"), btn = document.getElementById("bsync");
  const when = DROPS.last ? new Date(DROPS.last).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) : "";
  if(l) l.textContent = !BUNGIE_LINKED && !PREVIEW ? "Sync" : when && (BUNGIE_LINKED || PREVIEW) ? `Synced ${when}` : "Sync";
  if(btn){ const tip = BUNGIE_LINKED ? `Sync with Bungie now${when ? ` (last synced ${when})` : ""}` : PREVIEW ? `Sample sync: simulates new drops${when ? ` (last ${when})` : ""}` : (BUNGIE ? "Sign in with Bungie to sync" : "Connect your Bungie account to sync (coming soon)");
    btn.dataset.tip = tip; btn.setAttribute("aria-label", tip); }
}
let syncing = false;
async function syncNow(why){
  if(syncing) return;
  if(!BUNGIE_LINKED && !PREVIEW){ if(why === "manual") toast(BUNGIE ? "Sign in with Bungie to sync your weapons" : "Bungie account sync isn't connected yet"); return; }
  syncing = true; const btn = document.getElementById("bsync"); if(btn) btn.classList.add("spin");
  await new Promise(r => setTimeout(r, 650));
  let fresh = [];
  if(BUNGIE_LINKED){
    try{
      const copies = await bProfile();
      Object.keys(RC_SYNC).forEach(k => delete RC_SYNC[k]); Object.assign(RC_SYNC, copies);
      const now = {}; Object.entries(copies).forEach(([k, cs]) => cs.forEach(c => now[c.cid] = k));
      const LSEEN = "bia.seen." + BACCT.id, seen = local.get(LSEEN, null);
      if(seen){                                         // anything not there last time is a new drop
        Object.entries(now).forEach(([cid, k]) => { if(!seen[cid]){ const c = copies[k].find(x => x.cid === cid); fresh.push({id: cid, k, c, at: Date.now(), seen: false}); } });
      } else if(why !== "auto") toast(`Synced ${plural(Object.keys(now).length, "weapon", "weapons")} from your account`);
      local.set(LSEEN, Object.fromEntries(Object.keys(now).map(cid => [cid, 1])));
      DROPS.list.forEach(d => { const k = now[d.c.cid]; if(k){ const c = copies[k].find(x => x.cid === d.c.cid); if(c) d.c = c; } });   // keep drop cards current (location)
      if(why !== "auto" || fresh.length) render();
    }catch(e){
      syncing = false; if(btn) btn.classList.remove("spin");
      bError(e); return;
    }
  }
  else if(why === "manual"){                          // sample: pretend an activity just dropped a few weapons
    const r = seeded("drop" + Date.now()), pool = Object.keys(TWIN.pve).filter(k => TWIN.pvp[k] || Math.random() < 0.5);
    const n = 1 + Math.floor(r() * 3);
    let k = pool[Math.floor(r() * pool.length)];
    for(let i = 0; i < n; i++){
      if(i && r() > 0.35) k = pool[Math.floor(r() * pool.length)];   // sometimes a duplicate of the last drop
      const c = sampleCopies(k, {seed: k + Date.now() + i, n: 1})[0];
      if(!c) continue;
      c.loc = r() < 0.2 ? "post" : CHARS[Math.floor(r() * 3)];      // a fresh drop sits on the character who earned it, or at the Postmaster
      (DROPS.copies[k] = DROPS.copies[k] || []).push(c);
      fresh.push({id: Date.now() + "-" + i, k, c, at: Date.now(), seen: false});
    }
  }
  DROPS.list = DROPS.list.concat(fresh); DROPS.last = Date.now();
  if(S.view === "drops") fresh.forEach(d => d.seen = true);
  saveDrops(); syncing = false; if(btn) btn.classList.remove("spin");
  paintSync();
  if(fresh.length){
    toast(`${plural(fresh.length, "new drop", "new drops")}${BUNGIE_LINKED ? "" : " (sample)"}`);
    if(S.view === "drops" || S.view === "weapons" || S.view === "vault") render();
  }
}
/* ---------- where each copy sits, and moving it (like DIM) ----------
   Bungie reports every weapon's location: the Vault, a character (Hunter, Titan, Warlock) or the Postmaster.
   The location chip next to "Copy 1" (report card panel) and after the drop time (New Drops) opens a menu to send
   the copy elsewhere. A character to character move is done as two transfers through the Vault, but it is one click
   here. Until account sync, sample copies get made up locations and a move only changes the sample. */
const LOCS = {vault: "Vault", hunter: "Hunter", titan: "Titan", warlock: "Warlock", post: "Postmaster"};
const CHARS = ["hunter", "titan", "warlock"];
function locOf(c, seedKey){
  if(!c.cid){ c.cid = "c" + Math.abs(seeded(seedKey + JSON.stringify(c.p1 || ""))() * 1e9 | 0).toString(36); }
  if(!c.loc){ const r = seeded("loc" + c.cid)(); c.loc = r < 0.5 ? "vault" : CHARS[Math.floor((r - 0.5) / 0.5 * 3)] || "hunter"; }
  return c.loc;
}
function locIcon(loc){

let docRef = null, soundRef = null, sync = "loading";
function setSync(s){
  sync = s;
  const map = {loading:["Loading","var(--faint)"],saved:["Synced","var(--god)"],saving:["Saving","var(--semi)"],local:["This device only","var(--faint)"],error:["Not saved","var(--t-d)"],signedout:["Not signed in","var(--faint)"],offline:["Offline","var(--t-d)"]};
  const [l,c] = map[s] || map.local;
  const el = document.getElementById("sync");
  el.style.setProperty("--c", c); el.querySelector(".label").textContent = l;
  // signed in with Bungie the label stays out of the way; it only shows up when a save didn't go through (Joe, 2026-11-03)
  el.hidden = BUNGIE_LINKED && s !== "error" && s !== "offline";
  if(BUNGIE_LINKED && (s === "error" || s === "offline")){
    el.title = s === "error" ? "Your last change didn't reach your saved progress, usually because the Bungie sign in ran out (it lasts an hour). It's kept in this browser and goes up the next time you sign in with Bungie."
      : "Couldn't reach the progress service. Your changes are kept in this browser and go up the next time you sign in with Bungie.";
    return;
  }
  el.title = s === "saved" ? "Your progress is saved to your account and follows you to other devices."
    : s === "local" ? "Account sync isn't available in this view, so progress is saved in this browser only."
    : s === "signedout" ? "Progress is saved in this browser only. Sign in with Google to save it to your account and use it on any device."
    : s === "offline" ? "Couldn't reach the sign in service. Progress is saved in this browser for now."
    : s === "error" ? "The last change didn't save to your account. It's kept in this browser and will retry on your next change." : "";
}
let writing = false, writeAgain = false;
async function persist(){
  local.set(LKEY, {marks, armor, armorLook, cls:armorCls, mode:MODE});
  if(!docRef){ return; }
  if(writing){ writeAgain = true; return; }
  writing = true; setSync("saving");
  try{
    do{
      writeAgain = false;
      const body = {v:1, marks, armor, armorLook, cls:armorCls, mode:MODE};
      try{ await docRef.set(body); }
      catch(e){
        if(e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); await docRef.set(body); }
        else throw e;
      }
    }while(writeAgain);
    setSync("saved");
  }catch(e){
    if(e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")){ docRef = null; setSync("local"); }
    else setSync("error");
  }finally{ writing = false; }
}
let unsubVault = null;
function attachStore(ref, sref){
  soundRef = sref;
  let first = true;
  unsubVault = ref.onSnapshot(snap => {
    if(writing || snap.metadata.hasPendingWrites) return;
    if(first){
      first = false; docRef = ref;
      if(!snap.exists){
        if(Object.keys(marks).length || Object.keys(armor).length || Object.keys(armorLook).length) persist(); else setSync("saved");
        return;
      }
    }
    if(!snap.exists) return;
    const data = snap.data() || {};
    marks = JSON.parse(JSON.stringify(data.marks || {}));
    armor = JSON.parse(JSON.stringify(data.armor || {}));
    armorLook = JSON.parse(JSON.stringify(data.armorLook || {}));
    if(CLASSES.some(c => c[0] === data.cls)) armorCls = data.cls;
    if((data.mode === "pvp" || data.mode === "pve") && data.mode !== MODE){ applyMode(data.mode); fixScope(); }
    local.set(LKEY, {marks, armor, armorLook, cls:armorCls, mode:MODE});
    setSync("saved");
    if(overlay.hidden && menu.hidden) render();
  }, () => { docRef = null; setSync(FB_CONFIG ? "error" : "local"); });
}
async function initSync(){
  if(FB_CONFIG) return initFirebase(FB_CONFIG);
  try{
    if(!window.claude || !window.claude.use){ setSync("local"); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user){ setSync("local"); return; }
    const uid = await user.id();
    if(!uid){ setSync("local"); return; }
    attachStore(db.doc("data/users/" + uid + "/vault"), db.doc("data/users/" + uid + "/sound"));
  }catch(e){ setSync("local"); }
}

/* ================= BUNGIE ACCOUNT (website) =================
   Sign in with Bungie (OAuth, public client: no secret in the page), then read the account's weapons straight from
   Bungie's API, the way DIM does. Settings come from bungie/config.json at build time: {"apiKey", "clientId"}.
   The app registered at bungie.net/en/Application needs: OAuth client type Public, the redirect URL and origin of
   this site, and the scopes "Read your Destiny 2 information" and "Move or equip Destiny gear".
   Public clients get a one hour access token and no refresh token, so after an hour Bungie asks you to sign in again.
   hashes.json (kit/bungie_hashes.py) maps Bungie's item and plug hashes to the sheet's weapons and part names. */
const BUNGIE = (() => { try{ const c = JSON.parse(document.getElementById("vault-bungie").textContent); return c && c.apiKey && c.clientId ? c : null; }catch(e){ return null; } })();
const HASH = (() => { try{ return JSON.parse(document.getElementById("vault-hashes").textContent) || {w:{}, p:{}}; }catch(e){ return {w:{}, p:{}}; } })();
const B_ROOT = "https://www.bungie.net";
const LTOK = "bia.bungie.token.v1";
const VAULT_BUCKET = 138197802, POST_BUCKET = 215593132;
let BT = local.get(LTOK, null);           // {access, exp, mid}
let BACCT = null;                         // {type, id, name, chars: {characterId: class}, byClass: {class: characterId}}
const bTokenOk = () => !!(BT && BT.access && BT.exp > Date.now());
async function bfetch(path, opt){
  if(!bTokenOk()) throw {auth: true};
  const r = await fetch(B_ROOT + path, Object.assign({}, opt, {headers: Object.assign({"X-API-Key": BUNGIE.apiKey, "Authorization": "Bearer " + BT.access},
    opt && opt.body ? {"Content-Type": "application/json"} : {})}));
  if(r.status === 401) throw {auth: true};
  let j; try{ j = await r.json(); }catch(e){ throw {msg: `Bungie answered ${r.status}`}; }
  if(j.ErrorCode === 99 || j.ErrorCode === 2106 || j.ErrorCode === 2107) throw {auth: true};   // WebAuthRequired, token expired or invalid
  if(j.ErrorCode !== 1) throw {msg: j.Message || ("Bungie error " + j.ErrorCode), code: j.ErrorCode};
  return j.Response;
}
function bError(e){
  if(e && e.auth){ bSignOut(true); toast("Your Bungie sign in expired. Sign in again to keep syncing."); return; }
  toast((e && e.msg) || "Couldn't reach Bungie. Try again in a moment.");
}
function bSignIn(){
  const st = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try{ sessionStorage.setItem("bia.oauth.state", st); }catch(e){}
  location.href = `${B_ROOT}/en/OAuth/Authorize?client_id=${encodeURIComponent(BUNGIE.clientId)}&response_type=code&state=${st}`;
}
async function bHandleRedirect(){                  // back from bungie.net with ?code=...&state=...
  const q = new URLSearchParams(location.search), code = q.get("code");
  if(!code) return;
  const st = q.get("state"); let saved = null; try{ saved = sessionStorage.getItem("bia.oauth.state"); sessionStorage.removeItem("bia.oauth.state"); }catch(e){}
  history.replaceState(null, "", location.pathname + location.hash);
  if(saved && st !== saved){ toast("That sign in didn't match. Please try again."); return; }
  try{
    const r = await fetch(B_ROOT + "/platform/app/oauth/token/", {method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded", "X-API-Key": BUNGIE.apiKey},
      body: `grant_type=authorization_code&code=${encodeURIComponent(code)}&client_id=${encodeURIComponent(BUNGIE.clientId)}`});
    const j = await r.json();
    if(!j.access_token) throw new Error(j.error_description || j.error || "no token");
    BT = {access: j.access_token, exp: Date.now() + Math.max(60, (j.expires_in || 3600) - 60) * 1000, mid: j.membership_id};
    local.set(LTOK, BT);
  }catch(e){ toast("Bungie sign in didn't finish. Please try again."); }
}
async function bLoadAccount(){
  const m = await bfetch("/Platform/User/GetMembershipsForCurrentUser/");
  const ms = m.destinyMemberships || [];
  const pick = ms.find(x => x.membershipId === m.primaryMembershipId) || ms.find(x => x.crossSaveOverride && x.crossSaveOverride === x.membershipType) || ms[0];
  if(!pick) throw {msg: "No Destiny 2 account was found on that Bungie account."};
  const code = pick.bungieGlobalDisplayNameCode;
  BACCT = {type: pick.membershipType, id: pick.membershipId, chars: {}, byClass: {},
           name: pick.bungieGlobalDisplayName ? pick.bungieGlobalDisplayName + (code != null ? "#" + String(code).padStart(4, "0") : "") : ((m.bungieNetUser || {}).uniqueName || pick.displayName || "Guardian")};
}
// every weapon the account owns that one of the sheets rates: {weapon key: [copy, ...]}
async function bProfile(){
  const r = await bfetch(`/Platform/Destiny2/${BACCT.type}/Profile/${BACCT.id}/?components=102,200,201,205,305,310`);
  const chars = {}, byClass = {}, last = {};
  Object.entries((r.characters || {}).data || {}).forEach(([cid, c]) => {
    const cls = ["titan", "hunter", "warlock"][c.classType]; if(!cls) return;
    chars[cid] = cls;
    if(!byClass[cls] || (c.dateLastPlayed || "") > last[cls]){ byClass[cls] = cid; last[cls] = c.dateLastPlayed || ""; }
  });
  BACCT.chars = chars; BACCT.byClass = byClass;
  const all = [];
  (((r.profileInventory || {}).data || {}).items || []).forEach(it => { if(it.bucketHash === VAULT_BUCKET) all.push([it, "vault", null, false]); });
  Object.entries((r.characterInventories || {}).data || {}).forEach(([cid, inv]) => (inv.items || []).forEach(it => all.push([it, it.bucketHash === POST_BUCKET ? "post" : chars[cid], cid, false])));
  Object.entries((r.characterEquipment || {}).data || {}).forEach(([cid, inv]) => (inv.items || []).forEach(it => all.push([it, chars[cid], cid, true])));
  const sockets = (((r.itemComponents || {}).sockets || {}).data) || {}, reus = (((r.itemComponents || {}).reusablePlugs || {}).data) || {};
  const out = {};
  for(const [it, loc, cid, equipped] of all){
    if(!loc || !it.itemInstanceId) continue;
    let k = HASH.w[it.itemHash]; if(!k) continue;
    if(Array.isArray(k)) k = k[0];
    const sk = (sockets[it.itemInstanceId] || {}).sockets || [], rp = (reus[it.itemInstanceId] || {}).plugs || {};
    const c = {cid: it.itemInstanceId, itemHash: it.itemHash, loc, charId: cid, equipped, barrel: [], mag: [], p1: [], p2: [], origin: [], mw: ""};
    let col = 0;
    sk.forEach((sock, i) => {
      const cur = sock.plugHash && HASH.p[sock.plugHash];
      if(!cur) return;                                // shaders, mods, trackers, ornaments
      const kd = cur[1];
      const rolled = (rp[i] || []).map(p => HASH.p[p.plugItemHash]).filter(x => x && x[1] === kd).map(x => x[0]);
      const names = [...new Set(rolled.length ? rolled : [cur[0]])].filter(n => !/^empty /i.test(n));   // Bungie's order, as the game shows it
      if(kd === "perk"){ if(col < 2) c[col ? "p2" : "p1"] = names; col++; }
      else if(kd === "barrel") c.barrel = names;
      else if(kd === "mag") c.mag = names;
      else if(kd === "origin") c.origin = names;
      else if(kd === "mw") c.mw = mwClean(cur[0]);
    });
    (out[k] = out[k] || []).push(c);
  }
  return out;
}
// Postmaster pulls go to the character the item is waiting for; a character to character move goes through the Vault
async function bTransfer(c, to){
  const mt = BACCT.type, body = o => ({method: "POST", body: JSON.stringify(Object.assign({itemReferenceHash: c.itemHash, stackSize: 1, itemId: c.cid, membershipType: mt}, o))});
  if(c.loc === "post"){
    await bfetch("/Platform/Destiny2/Actions/Items/PullFromPostmaster/", body({characterId: c.charId}));
    c.loc = BACCT.chars[c.charId]; if(c.loc === to) return;
  }
  if(c.equipped) throw {msg: "That copy is equipped. Equip something else in game, then try again."};
  if(c.loc !== "vault"){ await bfetch("/Platform/Destiny2/Actions/Items/TransferItem/", body({transferToVault: true, characterId: c.charId})); c.loc = "vault"; }
  if(to !== "vault"){
    const target = BACCT.byClass[to]; if(!target) throw {msg: `There's no ${LOCS[to]} on this account.`};
    await bfetch("/Platform/Destiny2/Actions/Items/TransferItem/", body({transferToVault: false, characterId: target}));
    c.loc = to; c.charId = target;
  }
}
function bSignOut(quiet){

}

}
function openBungieMenu(btn){

    <div class="sep"></div>

async function bootBungie(){
  if(!BUNGIE) return;
