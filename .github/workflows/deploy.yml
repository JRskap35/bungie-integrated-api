name: Build and publish Bungie-Integrated-API

on:
  schedule:
    - cron: "47 23 * * 3"   # every Wednesday evening (US Eastern), after the weekly reset
  workflow_dispatch:         # "Run workflow" button for an update on demand
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # progress sync (cloud/): saved under Settings > Secrets and variables > Actions. Without them the site still
      # builds, and hand-entered progress stays in each browser.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reuse Bungie's manifest and icons from earlier runs
        uses: actions/cache@v4
        with:
          path: build/bungie_cache
          key: bungie-${{ github.run_id }}
          restore-keys: bungie-
      - name: Deploy progress sync (Cloudflare Worker)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: bash cloud/deploy.sh
      - name: Rebuild from TheAegisRelic's and Pride Eternal's sheets and Bungie's API
        env:
          SITE_URL: https://jrskap35.github.io/bungie-integrated-api/
        run: bash kit/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
