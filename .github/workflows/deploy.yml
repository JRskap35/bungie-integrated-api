name: Build and publish Endgame API

on:
  schedule:
    - cron: "47 23 * * 3"   # every Wednesday evening (US Eastern), after the weekly reset
  workflow_dispatch:         # "Run workflow" button for an update on demand
  push:
    branches: [main]

permissions:
  contents: write     # the perk editor build is kept on the perk-editor-build branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ghpages: ${{ steps.ghcheck.outputs.changed }}
    env:
      # progress sync (cloud/): saved under Settings > Secrets and variables > Actions. Without them the site still
      # builds, and hand-entered progress stays in each browser.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reuse Bungie's manifest and icons from earlier runs
        uses: actions/cache@v4
        with:
          path: build/bungie_cache
          key: bungie-${{ github.run_id }}
          restore-keys: bungie-
      - name: Deploy progress sync (Cloudflare Worker)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: bash cloud/deploy.sh
      - name: Rebuild from TheAegisRelic's and Pride Eternal's sheets and Bungie's API
        env:
          SITE_URL: https://endgameapi.pages.dev/
        run: bash kit/build.sh
      # the perk editor's UPDATE task republishes this page in Claude; it reads it through git (one commit, replaced each run)
      - name: Keep the perk editor build on the perk-editor-build branch
        continue-on-error: true
        run: |
          cd build/editor
          git init -q -b perk-editor-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perk-editor.html
          git commit -qm "Perk editor build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" perk-editor-build
          echo "Perk editor build saved for ${GITHUB_SHA::7}"
      - name: Publish to Cloudflare Pages (endgameapi.pages.dev)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: bash cloud/deploy_pages.sh
      - name: Forward the old GitHub address to endgameapi.pages.dev
        run: bash cloud/github_redirect.sh
      # GitHub Pages only needs a new upload when its page changes: the forwarding page is the same every week, and the
      # full site goes there only if the Cloudflare publish failed (then the pages differ and it is uploaded)
      - name: Does GitHub Pages need updating?
        id: ghcheck
        run: |
          if curl -sSfL --max-time 60 https://jrskap35.github.io/bungie-integrated-api/ -o build/gh_live.html && cmp -s build/gh_live.html build/ghsite/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "GitHub Pages already serves this page; no upload"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "GitHub Pages will be updated"
          fi
      - uses: actions/configure-pages@v5
        if: steps.ghcheck.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.ghcheck.outputs.changed == 'true'
        with:
          path: build/ghsite

  deploy:
    needs: build
    if: needs.build.outputs.ghpages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
