name: Build and publish Endgame API

on:
  schedule:
    - cron: "47 23 * * 3"   # every Wednesday evening (US Eastern), after the weekly reset
  workflow_dispatch:         # "Run workflow" button for an update on demand
  push:
    branches: [main]

permissions:
  contents: write     # the perk editor build is kept on the perk-editor-build branch
  issues: write       # each Wednesday update files its report as an issue
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ghpages: ${{ steps.ghcheck.outputs.changed }}
    env:
      # progress sync (cloud/): saved under Settings > Secrets and variables > Actions. Without them the site still
      # builds, and hand-entered progress stays in each browser.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reuse Bungie's manifest and icons from earlier runs
        uses: actions/cache@v4
        with:
          path: build/bungie_cache
          key: bungie-${{ github.run_id }}
          restore-keys: bungie-
      - name: Deploy progress sync (Cloudflare Worker)
        id: worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: bash cloud/deploy.sh
      - name: Rebuild from TheAegisRelic's and Pride Eternal's sheets and Bungie's API
        id: build
        env:
          SITE_URL: https://endgameapi.pages.dev/
        run: mkdir -p build && bash kit/build.sh 2>&1 | tee build/build.log
      # the perk editor's UPDATE task republishes this page in Claude; it reads it through git (one commit, replaced each run)
      - name: Keep the perk editor build on the perk-editor-build branch
        id: editor_branch
        continue-on-error: true
        run: |
          cd build/editor
          git init -q -b perk-editor-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perk-editor.html
          git commit -qm "Perk editor build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" perk-editor-build
          echo "Perk editor build saved for ${GITHUB_SHA::7}"
      - name: Publish to Cloudflare Pages (endgameapi.pages.dev)
        id: publish
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        run: bash cloud/deploy_pages.sh
      - name: Forward the old GitHub address to endgameapi.pages.dev
        id: redirect
        run: bash cloud/github_redirect.sh
      # GitHub Pages only needs a new upload when its page changes: the forwarding page is the same every week, and the
      # full site goes there only if the Cloudflare publish failed (then the pages differ and it is uploaded)
      - name: Does GitHub Pages need updating?
        id: ghcheck
        run: |
          if curl -sSfL --max-time 60 https://jrskap35.github.io/bungie-integrated-api/ -o build/gh_live.html && cmp -s build/gh_live.html build/ghsite/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "GitHub Pages already serves this page; no upload"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "GitHub Pages will be updated"
          fi
      - uses: actions/configure-pages@v5
        if: steps.ghcheck.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.ghcheck.outputs.changed == 'true'
        with:
          path: build/ghsite
      # the update report (kit/status_report.py): a checklist of every step, what changed and any problems. It goes on
      # this run's summary page, and the Wednesday and on demand runs also file it as an issue labelled weekly-update:
      # closed straight away when all is well, left open and assigned to the owner when something needs a look. Runs
      # after a code push only file one when they fail.
      - name: Write the update report
        if: always()
        env:
          WORKER: ${{ steps.worker.outcome }}
          BUILD: ${{ steps.build.outcome }}
          EDITOR_BRANCH: ${{ steps.editor_branch.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          REDIRECT: ${{ steps.redirect.outcome }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I kit/status_report.py build/status.md build/status.json
          cat build/status.md >> "$GITHUB_STEP_SUMMARY"
          state=$(jq -r .state build/status.json); title=$(jq -r .title build/status.json)
          if [ "$EVENT" != "push" ] || [ "$state" = "fail" ]; then
            gh label create weekly-update --color 1F6FEB --description "Report from the Wednesday update" >/dev/null 2>&1 || true
            args=(--title "$title" --body-file build/status.md --label weekly-update)
            if [ "$state" != "ok" ]; then args+=(--assignee "$OWNER"); fi
            url=$(gh issue create "${args[@]}")
            echo "Report filed: $url"
            if [ "$state" = "ok" ]; then gh issue close "$url" --reason completed >/dev/null; fi
          fi

  deploy:
    needs: build
    if: needs.build.outputs.ghpages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
