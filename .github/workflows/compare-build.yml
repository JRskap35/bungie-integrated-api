name: Compare build order (temporary)
on:
  push:
    branches: [build-order]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: new }
      - uses: actions/checkout@v4
        with: { path: old, ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r new/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: bcache
          key: bungie-none
          restore-keys: bungie-
      - name: Old build (main)
        run: |
          start=$(date +%s)
          cd old && BUNGIE_CACHE=$GITHUB_WORKSPACE/bcache SITE_URL=https://endgameapi.pages.dev/ GITHUB_STEP_SUMMARY=/dev/null bash kit/build.sh > ../old.log 2>&1 || { tail -40 ../old.log; exit 1; }
          echo "old build took $(( $(date +%s) - start ))s"
      - name: New build (this branch)
        run: |
          start=$(date +%s)
          cd new && BUNGIE_CACHE=$GITHUB_WORKSPACE/bcache SITE_URL=https://endgameapi.pages.dev/ bash kit/build.sh 2>&1 | tee ../new.log
          echo "new build took $(( $(date +%s) - start ))s"
      - name: Compare
        run: |
          python3 -I new/.github/compare/compare.py old/site/index.html new/site/index.html
          cmp old/site/pvp_usage.json new/site/pvp_usage.json && echo "PvP store identical"
          echo "--- old log ---"; cat old.log | tail -60
